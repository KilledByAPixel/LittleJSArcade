<!DOCTYPE html><head>
<title>LittleJS Jouster</title>
<meta charset="utf-8">
</head>
<script src="../templates/engineLoader.js?1780767748506"></script>
<script src="../templates/textureGenerator.js?1780767748506"></script>
<script src="../templates/gameFx.js?1780767748506"></script>
<script src="../templates/menus.js?1780767748506"></script>
<script>
'use strict';

// engine settings
gravity = vec2(0, -0.005);
canvasFixedSize = vec2(1920, 1080);
cameraScale = 48;

// gamepad: on-screen touch gamepad for mobile (left stick = move, face button = flap)
touchGamepadEnable = true;
touchGamepadAnalog = true;   // analog left stick for horizontal movement
touchGamepadButtonCount = 1; // single face button taps as A(0) to flap

///////////////////////////////////////////////////////////////////////////////
// Constants

const LEVEL_WIDTH = 38;
const LEVEL_HEIGHT = 22;
const FLAP_FORCE = 0.09;  // Reduced from 0.35 for more deliberate movement
const MAX_SPEED = 0.2;   // Reduced from 0.3 for slower pace
const HORIZONTAL_ACCEL = 0.002;  // Reduced from 0.015 for more control
const AIR_FRICTION = 0.999;
const WRAP_MARGIN = 1;

// Colors
const PLAYER_COLOR = hsl(0.55, 0.8, 0.6);
const PLAYER_BIRD_COLOR = hsl(0.12, 0.9, 0.7);
const ENEMY_COLOR = hsl(0.0, 0.8, 0.55);
const ENEMY_BIRD_COLOR = hsl(0.08, 0.6, 0.4);
const SHADOW_RIDER_COLOR = hsl(0.75, 0.6, 0.4);
const SHADOW_BIRD_COLOR = hsl(0.75, 0.3, 0.3);
const PLATFORM_COLOR = hsl(0.08, 0.4, 0.35);
const LAVA_COLOR = hsl(0.05, 1, 0.5);
const EGG_COLOR = hsl(0.12, 0.3, 0.85);

// Game state
let player;
let enemies = [];
let eggs = [];
let platforms = [];
let score = 0;
let lives = 3;
let wave = 0;
let gameState = 'title'; // title, playing, gameover, victory
let waveTimer = 0;
let spawnQueue = 0;
let respawnTimer = 0;   // >0 counts down to player respawn (update-loop, not setTimeout)

// Sounds
let sfxFlap, sfxJoust, sfxDie, sfxEgg, sfxSpawn, sfxWave;

///////////////////////////////////////////////////////////////////////////////
// Platform class

class Platform
{
    constructor(x, y, width)
    {
        this.pos = vec2(x, y);
        this.size = vec2(width, 0.5);
    }

    render()
    {
        // Main platform body
        drawRect(this.pos, this.size, PLATFORM_COLOR);
        // Top highlight
        drawRect(this.pos.add(vec2(0, 0.15)), vec2(this.size.x, 0.2), PLATFORM_COLOR.scale(1.3, 1));
        // Bottom shadow
        drawRect(this.pos.add(vec2(0, -0.15)), vec2(this.size.x, 0.2), PLATFORM_COLOR.scale(0.7, 1));
    }

    collidesWith(pos, size)
    {
        return isOverlapping(pos, size, this.pos, this.size);
    }
}

///////////////////////////////////////////////////////////////////////////////
// Rider class (base for player and enemies)

class Rider
{
    constructor(x, y, isPlayer = false)
    {
        this.pos = vec2(x, y);
        this.vel = vec2(0, 0);
        this.size = vec2(1.2, 1.4);
        this.isPlayer = isPlayer;
        this.facingRight = true;
        this.flapTimer = 0;
        this.wingAngle = 0;
        this.alive = true;
        this.grounded = false;
        this.invulnerable = 0;
        
        // Enemy AI
        this.aiTimer = 0;
        this.aiTarget = null;
        this.enemyType = 0; // 0 = normal, 1 = shadow rider
    }

    update()
    {
        if (!this.alive) return;

        // Apply gravity
        this.vel.y += gravity.y;

        // Air friction
        this.vel = this.vel.scale(AIR_FRICTION);

        // Clamp speed
        this.vel.x = clamp(this.vel.x, -MAX_SPEED, MAX_SPEED);
        this.vel.y = clamp(this.vel.y, -MAX_SPEED * 1.5, MAX_SPEED);

        // Move
        this.pos = this.pos.add(this.vel);

        // Screen wrapping (horizontal)
        if (this.pos.x < -WRAP_MARGIN)
            this.pos.x = LEVEL_WIDTH + WRAP_MARGIN;
        else if (this.pos.x > LEVEL_WIDTH + WRAP_MARGIN)
            this.pos.x = -WRAP_MARGIN;

        // Platform collision
        this.grounded = false;
        for (const platform of platforms)
        {
            if (this.vel.y <= 0 && this.checkPlatformCollision(platform))
            {
                this.pos.y = platform.pos.y + platform.size.y / 2 + this.size.y / 2;
                this.vel.y = 0;
                this.grounded = true;
            }
        }

        // Lava death
        if (this.pos.y < -1)
        {
            this.die();
            return;
        }

        // Ceiling bounce
        if (this.pos.y > LEVEL_HEIGHT - 1)
        {
            this.pos.y = LEVEL_HEIGHT - 1;
            this.vel.y = -abs(this.vel.y) * 0.5;
        }

        // Update timers
        if (this.flapTimer > 0) this.flapTimer -= timeDelta;
        if (this.invulnerable > 0) this.invulnerable -= timeDelta;

        // Animate wings
        if (this.flapTimer > 0)
            this.wingAngle = sin(time * 30) * 0.8;
        else if (!this.grounded)
            this.wingAngle = sin(time * 8) * 0.3;
        else
            this.wingAngle = 0;
    }

    checkPlatformCollision(platform)
    {
        const feetY = this.pos.y - this.size.y / 2;
        const prevFeetY = feetY - this.vel.y;
        const platformTop = platform.pos.y + platform.size.y / 2;

        if (prevFeetY >= platformTop - 0.1 && feetY <= platformTop + 0.1)
        {
            if (abs(this.pos.x - platform.pos.x) < platform.size.x / 2 + this.size.x / 2 - 0.3)
                return true;
        }
        return false;
    }

    flap()
    {
        if (!this.alive) return;
        this.vel.y = FLAP_FORCE;
        this.flapTimer = 0.15;
        this.grounded = false;
        sfxFlap && sfxFlap.play(this.pos);
    }

    moveHorizontal(dir)
    {
        if (!this.alive) return;
        this.vel.x += dir * HORIZONTAL_ACCEL;
        if (dir !== 0) this.facingRight = dir > 0;
    }

    die()
    {
        if (!this.alive) return;
        this.alive = false;
        sfxDie && sfxDie.play(this.pos);
        
        // Spawn death particles
        const deathColor = this.isPlayer ? PLAYER_COLOR : (this.enemyType === 1 ? SHADOW_RIDER_COLOR : ENEMY_COLOR);
        spawnBurst(this.pos, deathColor, 20, .22, .75, .2, 1.1);
    }

    render()
    {
        if (!this.alive) return;
        
        const alpha = (this.invulnerable > 0 && sin(time * 20) > 0) ? 0.5 : 1;
        const mirror = !this.facingRight;
        const riderColor = this.isPlayer ? PLAYER_COLOR : (this.enemyType === 1 ? SHADOW_RIDER_COLOR : ENEMY_COLOR);
        const birdColor = this.isPlayer ? PLAYER_BIRD_COLOR : (this.enemyType === 1 ? SHADOW_BIRD_COLOR : ENEMY_BIRD_COLOR);

        // Bird body
        const birdPos = this.pos.add(vec2(0, -0.2));
        drawTile(birdPos, vec2(1.0, 0.7), icons.circle, birdColor.scale(1, alpha));

        // Bird head
        const headOffset = mirror ? -0.4 : 0.4;
        const headPos = birdPos.add(vec2(headOffset, 0.2));
        drawTile(headPos, vec2(0.35), icons.circle, birdColor.scale(1, alpha));

        // Beak
        const beakOffset = mirror ? -0.25 : 0.25;
        drawTile(headPos.add(vec2(beakOffset, -0.05)), vec2(0.25, 0.12), icons.circle, hsl(0.1, 0.9, 0.6, alpha));

        // Eye
        const eyeOffset = mirror ? -0.08 : 0.08;
        drawTile(headPos.add(vec2(eyeOffset, 0.08)), vec2(0.08), icons.circle, rgb(0, 0, 0, alpha));

        // Wings
        const wingX = mirror ? 0.3 : -0.3;
        const wingY = this.wingAngle * 0.3;
        const wingPos = birdPos.add(vec2(wingX, wingY));
        drawTile(wingPos, vec2(0.4, 0.25), icons.circle, birdColor.scale(0.8, alpha), this.wingAngle * (mirror ? -1 : 1));

        // Legs
        const legColor = hsl(0.1, 0.7, 0.5, alpha);
        drawLine(birdPos.add(vec2(-0.15, -0.3)), birdPos.add(vec2(-0.2, -0.55)), 0.08, legColor);
        drawLine(birdPos.add(vec2(0.15, -0.3)), birdPos.add(vec2(0.2, -0.55)), 0.08, legColor);

        // Rider body
        const riderPos = this.pos.add(vec2(0, 0.35));
        drawTile(riderPos, vec2(0.5, 0.6), icons.circle, riderColor.scale(1, alpha));

        // Rider head
        drawTile(riderPos.add(vec2(0, 0.4)), vec2(0.25), icons.circle, riderColor.scale(1.2, alpha));

        // Helmet
        drawTile(riderPos.add(vec2(0, 0.5)), vec2(0.3, 0.15), icons.circle, riderColor.scale(0.8, alpha));
        
        // Lance
        const lanceDir = mirror ? -1 : 1;
        const lanceStart = riderPos.add(vec2(lanceDir * 0.2, 0));
        const lanceEnd = riderPos.add(vec2(lanceDir * 0.9, -0.3));
        drawLine(lanceStart, lanceEnd, 0.08, hsl(0.08, 0.3, 0.6, alpha));
        // Lance tip
        drawTile(lanceEnd, vec2(0.1), icons.circle, hsl(0.08, 0.2, 0.8, alpha));
    }
}

///////////////////////////////////////////////////////////////////////////////
// Egg class

class Egg
{
    constructor(x, y, enemyType = 0)
    {
        this.pos = vec2(x, y);
        this.vel = vec2(rand(-0.1, 0.1), rand(0, 0.1));
        this.size = vec2(0.5, 0.6);
        this.hatchTimer = 5 + rand(0, 3); // Time until it hatches
        this.collected = false;
        this.enemyType = enemyType;
    }

    update()
    {
        // Apply gravity
        this.vel.y += gravity.y * 0.5;
        this.vel = this.vel.scale(0.98);
        this.pos = this.pos.add(this.vel);

        // Platform collision
        for (const platform of platforms)
        {
            const feetY = this.pos.y - this.size.y / 2;
            const platformTop = platform.pos.y + platform.size.y / 2;
            
            if (this.vel.y <= 0 && feetY <= platformTop + 0.1 && feetY >= platformTop - 0.3)
            {
                if (abs(this.pos.x - platform.pos.x) < platform.size.x / 2)
                {
                    this.pos.y = platformTop + this.size.y / 2;
                    this.vel.y = 0;
                    this.vel.x *= 0.8;
                }
            }
        }

        // Lava
        if (this.pos.y < 0)
        {
            this.collected = true;
            return;
        }

        // Screen wrap
        if (this.pos.x < -WRAP_MARGIN)
            this.pos.x = LEVEL_WIDTH + WRAP_MARGIN;
        else if (this.pos.x > LEVEL_WIDTH + WRAP_MARGIN)
            this.pos.x = -WRAP_MARGIN;

        // Check player collection
        if (player && player.alive && isOverlapping(this.pos, this.size, player.pos, player.size))
        {
            this.collected = true;
            score += 250;
            sfxEgg && sfxEgg.play(this.pos);
            
            // Sparkle effect
            spawnBurst(this.pos, EGG_COLOR, 10, .18, .45, .15, 1.0);
            return;
        }

        // Hatch timer
        this.hatchTimer -= timeDelta;
        if (this.hatchTimer <= 0)
        {
            this.collected = true;
            spawnEnemy(this.pos.x, this.pos.y + 0.5, this.enemyType);
            sfxSpawn && sfxSpawn.play(this.pos);
        }
    }

    render()
    {
        // Egg shape
        const wobble = this.hatchTimer < 2 ? sin(time * 15) * 0.1 : 0;
        const eggColor = this.hatchTimer < 2 ? EGG_COLOR.lerp(ENEMY_COLOR, 0.3) : EGG_COLOR;
        drawTile(this.pos, this.size, icons.circle, eggColor, wobble);

        // Spots
        drawTile(this.pos.add(vec2(-0.1, 0.1)), vec2(0.08), icons.circle, eggColor.scale(0.85, 1));
        drawTile(this.pos.add(vec2(0.12, -0.05)), vec2(0.06), icons.circle, eggColor.scale(0.85, 1));
    }
}

///////////////////////////////////////////////////////////////////////////////
// Combat system

function checkJoustCombat()
{
    if (!player || !player.alive) return;
    if (player.invulnerable > 0) return;

    for (const enemy of enemies)
    {
        if (!enemy.alive) continue;
        if (!isOverlapping(player.pos, player.size, enemy.pos, enemy.size)) continue;

        // Determine winner by height (higher lance wins)
        const playerHeight = player.pos.y;
        const enemyHeight = enemy.pos.y;
        const heightDiff = playerHeight - enemyHeight;

        if (heightDiff > 0.15)
        {
            // Player wins!
            enemy.die();
            // Spawn egg lower so it's not instantly collected
            eggs.push(new Egg(enemy.pos.x, enemy.pos.y - 1.5, enemy.enemyType));
            score += 500 + enemy.enemyType * 250;
            sfxJoust && sfxJoust.play(enemy.pos);
            
            // Bounce player up slightly
            player.vel.y = 0.05;  // Reduced from 0.2
        }
        else if (heightDiff < -0.15)
        {
            // Enemy wins
            playerDeath();
        }
        else
        {
            // Draw - both bounce away
            const bounceDir = sign(player.pos.x - enemy.pos.x) || 1;
            player.vel.x = bounceDir * 0.05;  // Reduced from 0.2
            enemy.vel.x = -bounceDir * 0.05;  // Reduced from 0.2
            player.vel.y = 0.04;  // Reduced from 0.15
            enemy.vel.y = 0.04;  // Reduced from 0.15
        }
    }
}

function playerDeath()
{
    player.die();
    lives--;
    
    if (lives > 0)
    {
        // Respawn after a delay, counted down in gameUpdate so it respects pause
        // and quit. A setTimeout fired on wall-clock — it could spawn a rider
        // during a paused menu, or after the player had already quit.
        respawnTimer = 1.5;
    }
    else
    {
        gameState = 'gameover';
        showGameOverDialog({
            score,
            won: false,
            extraLines: [`Reached Wave ${wave}`],
            onContinue: quitToTitleWithCleanup,
        });
    }
}

///////////////////////////////////////////////////////////////////////////////
// Enemy AI

function updateEnemyAI(enemy)
{
    if (!enemy.alive || !player || !player.alive) return;

    enemy.aiTimer -= timeDelta;
    if (enemy.aiTimer <= 0)
    {
        enemy.aiTimer = rand(0.3, 0.8);
        
        // Simple AI: try to get above the player
        const dx = player.pos.x - enemy.pos.x;
        const dy = player.pos.y - enemy.pos.y;

        // Horizontal movement toward player
        if (abs(dx) > 2)
            enemy.moveHorizontal(sign(dx) * (2.0 + enemy.enemyType * 0.5));  // Reduced

        // Flap to get higher or chase
        if (dy > 0 || rand() < 0.3)
            enemy.flap();
    }

    // Random flapping to stay aloft
    if (!enemy.grounded && rand() < 0.02 + enemy.enemyType * 0.01)
        enemy.flap();
    
    // Move toward player
    const dx = player.pos.x - enemy.pos.x;
    enemy.moveHorizontal(sign(dx) * 0.1);  // Reduced from 0.3
}

function spawnEnemy(x, y, type = 0)
{
    const enemy = new Rider(x, y, false);
    enemy.enemyType = type;
    enemy.facingRight = rand() > 0.5;
    enemies.push(enemy);
}

function spawnWave()
{
    wave++;
    waveTimer = 3;
    
    // Number of enemies based on wave
    const baseEnemies = min(wave + 2, 8);
    const shadowRiders = wave >= 3 ? min(floor((wave - 2) / 2), 4) : 0;
    
    spawnQueue = baseEnemies + shadowRiders;
    
    sfxWave && sfxWave.play();
}

function processSpawnQueue()
{
    if (spawnQueue <= 0) return;
    
    waveTimer -= timeDelta;
    if (waveTimer > 0) return;
    
    // Spawn one enemy
    const spawnX = rand() > 0.5 ? rand(-2, 2) : rand(LEVEL_WIDTH - 2, LEVEL_WIDTH + 2);
    const spawnY = rand(LEVEL_HEIGHT * 0.5, LEVEL_HEIGHT - 2);
    const type = (wave >= 3 && rand() < 0.3) ? 1 : 0;
    
    spawnEnemy(spawnX, spawnY, type);
    spawnQueue--;
    waveTimer = 0.8;
}

///////////////////////////////////////////////////////////////////////////////
// Particle system

// One-shot bursts via the engine's ParticleEmitter (was a hand-rolled array).
// Fires ~count square particles in an upward `cone`-wide fan at `speed` (world
// units/frame), fading from `color` to transparent over `life` seconds, with
// gravity.y*0.3 pulling them back down — matching the old hand-rolled feel.
function spawnBurst(pos, color, count, speed, life, size, cone)
{
    const fade = rgb(color.r, color.g, color.b, 0);
    new ParticleEmitter(
        pos, 0,              // pos, angle
        0,                   // emitSize (point)
        count/400, 400,      // emitTime, emitRate -> ~count particles
        cone,                // emitConeAngle (upward fan)
        undefined,           // tileInfo (untextured square)
        color, color,        // colorStartA/B
        fade, fade,          // colorEndA/B (fade alpha to 0)
        life,                // particleTime
        size, size,          // sizeStart, sizeEnd (constant)
        speed,               // speed (world units per frame)
        0, 1, 1,             // angleSpeed, damping (none), angleDamping
        .3,                  // gravityScale (matches vel.y += gravity.y*0.3)
        0,                   // particleConeAngle (axis-aligned squares)
        .15,                 // fadeRate
        .4,                  // randomness
        false, true          // collideTiles, additive (glow)
    );
}

// clearParticles() lives in gameFx.js (shared).

///////////////////////////////////////////////////////////////////////////////
// Level setup

function createPlatforms()
{
    platforms = [];
    
    // Ground platforms (with gaps for danger)
    platforms.push(new Platform(5, 1, 8));
    platforms.push(new Platform(LEVEL_WIDTH - 5, 1, 8));
    
    // Middle platforms
    platforms.push(new Platform(LEVEL_WIDTH / 2, 5, 10));
    platforms.push(new Platform(6, 8, 6));
    platforms.push(new Platform(LEVEL_WIDTH - 6, 8, 6));
    
    // Upper platforms
    platforms.push(new Platform(LEVEL_WIDTH / 2, 12, 8));
    platforms.push(new Platform(4, 15, 5));
    platforms.push(new Platform(LEVEL_WIDTH - 4, 15, 5));
    
    // Top platform
    platforms.push(new Platform(LEVEL_WIDTH / 2, 18, 6));
}

///////////////////////////////////////////////////////////////////////////////
// Game callbacks

let icons;   // default-atlas icon map (name -> TileInfo), tinted per draw

function gameInit()
{
    saveDataInit('joust');
    icons = initDefaultAtlas();
    cameraPos = vec2(LEVEL_WIDTH / 2, LEVEL_HEIGHT / 2);
    
    // Initialize sounds
    sfxFlap = new SoundGenerator({ frequency: 180, release: 0.08, volume: 0.4, slide: 0.5 });
    sfxJoust = new SoundGenerator({ frequency: 300, release: 0.15, volume: 0.6, noise: 0.2, slide: -0.5 });
    sfxDie = new SoundGenerator({ frequency: 150, release: 0.3, volume: 0.5, noise: 0.4, slide: -0.8 });
    sfxEgg = new SoundGenerator({ frequency: 600, release: 0.1, volume: 0.5, slide: 0.3, pitchJump: 200, pitchJumpTime: 0.05 });
    sfxSpawn = new SoundGenerator({ frequency: 200, release: 0.2, volume: 0.4, slide: 0.5 });
    sfxWave = new SoundGenerator({ frequency: 440, release: 0.4, volume: 0.5, slide: 0.2, pitchJump: 220, pitchJumpTime: 0.1 });
    
    createPlatforms();
    resetGame();
    buildMenus();
    showMenu('title');
}

function resetGame()
{
    player = new Rider(LEVEL_WIDTH / 2, 8, true);
    enemies = [];
    eggs = [];
    clearParticles();
    score = 0;
    lives = 3;
    wave = 0;
    spawnQueue = 0;
    waveTimer = 0;
    respawnTimer = 0;
}

function startGame()
{
    resetGame();
    gameState = 'playing';
    setPlaying(true);
    spawnWave();
    clearSubmenuStack();
    hideAllMenus();
}

function quitToTitleWithCleanup()
{
    quitToTitle(() => { gameState = 'title'; });
}

function buildMenus()
{
    if (typeof createMenu !== 'function') return;

    installAutoPause();

    setMenuTheme({accent:'#e8b923', font:'"Palatino Linotype", "Book Antiqua", Palatino, serif'});
    createTitleMenu({
        title: 'JOUSTER',
        titleFx: {fill:'gold', motion:'float'},
        subtitle: '',
        onPlay: startGame,
        revealOnClick: false,
        items: [
            {type: 'button', label: 'HELP', onClick: () => pushMenu('help')},
        ],
    });

    createHelpMenu({
        title: 'HELP',
        text: 'Flap your ostrich to gain altitude and joust enemy riders — strike from above to knock them off and score points. Clear every wave to advance.',
        extraItems: [
            {type: 'text', text: 'Space / Up / W / Click flap · Arrows / WASD steer'},
        ],
    });

    createPauseMenu({
        onRestart: startGame,
        onQuit:    quitToTitleWithCleanup,
    });

    installDefaultToolbar();
}

function gameUpdate()
{
    if (bindPauseKey({when: () => isPlaying() && gameState === 'playing'})) return;
    if (!isPlaying()) return;

    if (gameState === 'gameover' || gameState === 'victory')
        return;   // the game-over dialog (showGameOverDialog) handles continue

    // Restart with R
    if (keyWasPressed('KeyR'))
    {
        startGame();
        return;
    }

    // Respawn timer — counted in the update loop so it respects pause/quit
    if (respawnTimer > 0)
    {
        respawnTimer -= timeDelta;
        if (respawnTimer <= 0)
        {
            player = new Rider(LEVEL_WIDTH / 2, LEVEL_HEIGHT - 3, true);
            player.invulnerable = 2;
        }
    }

    // Player input
    if (player && player.alive)
    {
        // Flapping - gamepad: A button (0) flaps as a tap, same as keyboard/mouse
        if (keyWasPressed('Space') || keyWasPressed('ArrowUp') || keyWasPressed('KeyW') || mouseWasPressed(0) || gamepadWasPressed(0))
            player.flap();

        // Horizontal movement - gamepad: merge left analog stick into keyDirection
        let move = keyDirection();
        const stick = gamepadStick(0);
        if (stick.lengthSquared() > .04) move = move.add(stick);
        if (move.lengthSquared() > 1) move = move.normalize(1);
        const moveDir = move.x;
        if (moveDir !== 0)
            player.moveHorizontal(moveDir);
    }
    
    // Update player
    if (player)
        player.update();
    
    // Update enemies
    for (const enemy of enemies)
    {
        if (enemy.alive)
        {
            updateEnemyAI(enemy);
            enemy.update();
        }
    }
    
    // Remove dead enemies (be more aggressive about cleanup)
    enemies = enemies.filter(e => e.alive);
    
    // Update eggs
    for (const egg of eggs)
        egg.update();
    eggs = eggs.filter(e => !e.collected);
    
    // Combat
    checkJoustCombat();

    // Wave management
    processSpawnQueue();
    
    // Check for wave completion - count only alive enemies
    const aliveEnemies = enemies.filter(e => e.alive).length;
    if (aliveEnemies === 0 && eggs.length === 0 && spawnQueue === 0 && player && player.alive)
    {
        if (wave >= 10)
        {
            gameState = 'victory';
            showGameOverDialog({
                score,
                won: true,
                extraLines: ['You conquered all 10 waves!'],
                onContinue: quitToTitleWithCleanup,
            });
        }
        else
        {
            spawnWave();
        }
    }
}

function gameUpdatePost()
{
    cameraPos = vec2(LEVEL_WIDTH / 2, LEVEL_HEIGHT / 2);
}

function gameRender()
{
    // Background gradient
    drawRect(cameraPos, vec2(100), rgb(0.05, 0.05, 0.15));
    
    // Lava at bottom
    const lavaHeight = 1.5;
    for (let i = 0; i < 3; i++)
    {
        const y = -0.5 + i * 0.3;
        const wave = sin(time * 2 + i) * 0.1;
        const alpha = 1 - i * 0.3;
        drawRect(vec2(LEVEL_WIDTH / 2, y + wave), vec2(LEVEL_WIDTH + 4, lavaHeight), LAVA_COLOR.scale(1, alpha));
    }
    
    // Draw platforms
    for (const platform of platforms)
        platform.render();
    
    // Draw eggs
    for (const egg of eggs)
        egg.render();
    
    // Draw enemies
    for (const enemy of enemies)
        enemy.render();
    
    // Draw player
    if (player)
        player.render();
}

function gameRenderPost()
{
    // HUD
    if (gameState === 'playing')
    {
        drawTextScreen(`Score: ${score}`, vec2(20, 30), 28, WHITE, 4, BLACK, 'left');
        drawTextScreen(`Lives: ${lives}`, vec2(mainCanvasSize.x - 20, 30), 28, WHITE, 4, BLACK, 'right');
        drawTextScreen(`Wave ${wave}`, vec2(mainCanvasSize.x / 2, 30), 32, hsl(0.15, 0.8, 0.6), 4, BLACK);
    }
    
    // (game over / victory are shown via showGameOverDialog, not canvas text)
}

///////////////////////////////////////////////////////////////////////////////

engineInit(gameInit, gameUpdate, gameUpdatePost, gameRender, gameRenderPost);

</script>
