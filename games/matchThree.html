<meta charset="utf-8">

    --menu-fg:           #fff;

<script src="../templates/engineLoader.js?1780767748506"></script>

<script src="../templates/textureGenerator.js?1780767748506"></script>
<script>
'use strict';

///////////////////////////////////////////////////////////////////////////////
// Constants

const fallTime = .2;
const swapTime = .15;
const clearTime = .18;   // matched gems flash & swell before they burst
const cameraOffset = vec2(0, -.5);

// === Board dimensions === change gridSize to resize the playable board (cols × rows).
const gridSize = vec2(8, 8);
const arenaSize = vec2(gridSize.x + .5, gridSize.y + 2); // playable grid + score-line padding

const backgroundColor = hsl(0, 0, .12);
const minMatchCount = 3;

// frame the playable arena (grid + score-line padding) via the shared helper
const fitCamera = () =>
    cameraFit(levelSize.scale(.5).add(cameraOffset), arenaSize);

// zzfx sound params from the LittleJS examples puzzle — already tuned
const sound_goodMove = new Sound([.4,.2,250,.04,,.04,,,1,,,,,3]);
const sound_badMove  = new Sound([,,700,,,.07,,,,3.7,,,,3,,,.1]);
const sound_fall     = new Sound([.2,,1900,,,.01,,1.4,,91,,,,,,,,,,.7]);

const tileColors =
[
    rgb(1,1,1),     // 0 white
    rgb(1,1,.2),    // 1 yellow
    rgb(1,.2,.2),   // 2 red
    rgb(.2,1,.2),   // 3 green
    rgb(.8,.2,1),   // 4 purple
    rgb(.1,.6,1),   // 5 blue
    rgb(.5,.5,.5),  // 6 gray
];
const tileTypeCount = tileColors.length;

///////////////////////////////////////////////////////////////////////////////
// State

let level, levelSize, levelFall, fallTimer, dragStartPos, comboCount, score;
// When the player initiates a swap, the two tiles slide past each other before
// the level data is actually swapped. If the swap doesn't produce a match the
// animation reverses and they slide back. {a, b, t, reversing} or null.
let swapAnim = null;
// Matched gems flash & swell for clearTime before bursting. {list, t, flags} or null.
let clearAnim = null;
let scorePopups = [];   // floating "+N" texts: {pos, text, t, life, color}
let comboBanner = null; // big center "COMBO xN!" punch: {n, t, life}
const gemSprites = []; // TileInfo per gem type, filled in gameInit
let bgPulse = 0;       // brief brightness flare on each cascade, decays over time

const getTile = (pos)=> level[pos.x + pos.y * levelSize.x];
const setTile = (pos, data)=> level[pos.x + pos.y * levelSize.x] = data;

///////////////////////////////////////////////////////////////////////////////
// Sprite painters — each fills a 500x500 region. Painted in white + black so
// drawTile's color tint produces gem-colored icons on the gem-colored bg.

function paintCircle(ctx)
{
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(250, 250, 200, 0, PI*2); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 28; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.arc(185, 185, 60, 0, PI*2); ctx.fill();
}

function paintStar(ctx)
{
    const cx = 250, cy = 260, rO = 215, rI = rO * .45;
    ctx.beginPath();
    for (let i = 0; i < 10; ++i)
    {
        const a = -PI/2 + i * PI/5;
        const r = i % 2 ? rI : rO;
        const x = cx + cos(a) * r, y = cy + sin(a) * r;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 28; ctx.stroke();
}

function paintHeart(ctx)
{
    // cy=120 centers the shape in the 500x500 region — the bezier extends
    // from cy-40 (top of lobes) to cy+300 (bottom point), so range [80, 420].
    const cx = 250, cy = 120, w = 100;
    const vPoint = .7;
    ctx.beginPath();
    ctx.moveTo(cx, cy + w * .4);
    ctx.bezierCurveTo(cx, cy - w * vPoint, cx - w * 2, cy - w * vPoint, cx - w * 2, cy + w * .3);
    ctx.bezierCurveTo(cx - w * 2, cy + w * 1.1, cx, cy + w * 2.2, cx, cy + w * 3);
    ctx.bezierCurveTo(cx, cy + w * 2.2, cx + w * 2, cy + w * 1.1, cx + w * 2, cy + w * .3);
    ctx.bezierCurveTo(cx + w * 2, cy - w * vPoint, cx, cy - w * vPoint, cx, cy + w * vPoint);
    ctx.closePath();
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 28; ctx.stroke();
}

function paintDiamond(ctx)
{
    const cx = 250, top = 50, bot = 450, sideY = 250;
    const left = 60, right = 440;
    ctx.beginPath();
    ctx.moveTo(cx, top);
    ctx.lineTo(right, sideY);
    ctx.lineTo(cx, bot);
    ctx.lineTo(left, sideY);
    ctx.closePath();
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 28; ctx.stroke();
}

function paintTriangle(ctx)
{
    const cx = 250, top = 60, bot = 440;
    ctx.beginPath();
    ctx.moveTo(cx, top);
    ctx.lineTo(440, bot);
    ctx.lineTo(60, bot);
    ctx.closePath();
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 28; ctx.stroke();
}

function paintBolt(ctx)
{
    ctx.beginPath();
    ctx.moveTo(210, 50);
    ctx.lineTo(100,  280);
    ctx.lineTo(220, 280);
    ctx.lineTo(170, 460);
    ctx.lineTo(410, 220);
    ctx.lineTo(270, 220);
    ctx.lineTo(400, 50);
    ctx.closePath();
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 28; ctx.stroke();
}

function paintPlus(ctx)
{
    const cx = 250, cy = 250, arm = 200, thick = 80;
    ctx.beginPath();
    ctx.moveTo(cx - thick, cy - arm);
    ctx.lineTo(cx + thick, cy - arm);
    ctx.lineTo(cx + thick, cy - thick);
    ctx.lineTo(cx + arm,   cy - thick);
    ctx.lineTo(cx + arm,   cy + thick);
    ctx.lineTo(cx + thick, cy + thick);
    ctx.lineTo(cx + thick, cy + arm);
    ctx.lineTo(cx - thick, cy + arm);
    ctx.lineTo(cx - thick, cy + thick);
    ctx.lineTo(cx - arm,   cy + thick);
    ctx.lineTo(cx - arm,   cy - thick);
    ctx.lineTo(cx - thick, cy - thick);
    ctx.closePath();
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 28; ctx.stroke();
}

///////////////////////////////////////////////////////////////////////////////
// Arcade cabinet (#demo): an auto-solver plays the board for a self-running demo.
const inCabinet = /demo/.test(location.hash);
let demoMoveTimer = 0;

async function gameInit()
{
    saveDataInit('match3');
    // Atlas of 7 gem icons. Each is white-on-black so drawTile's tint param
    // colors them at runtime, letting one atlas serve all 7 gem types.
    initDrawToTexture();
    gemSprites[0] = drawToTexture(0, paintCircle,   'glossy white circle gem with black outline');
    gemSprites[1] = drawToTexture(1, paintStar,     'white five-point star with black outline');
    gemSprites[2] = drawToTexture(2, paintHeart,    'white heart with black outline');
    gemSprites[3] = drawToTexture(3, paintDiamond,  'white diamond/rhombus with black outline');
    gemSprites[4] = drawToTexture(4, paintTriangle, 'white upward triangle with black outline');
    gemSprites[5] = drawToTexture(5, paintBolt,     'white lightning bolt with black outline');
    gemSprites[6] = drawToTexture(6, paintPlus,     'white plus / cross shape with black outline');

    levelSize = gridSize.copy();
    fitCamera();
    gravity = vec2(0, -.004);
    canvasClearColor = backgroundColor;

    // Populate the board now so the title screen has gems behind it.
    gameReset();

    setSoundVolume(.7);
    installAutoPause();

    setMenuTheme({accent:'#ff0099'});
    createTitleMenu({
        title: 'MATCH 3',
        titleFx: {fill:'rainbow', color:'#f0a', sparkle:true},
        subtitle: 'Swap adjacent gems to line up 3+ in a row',
        showBest: true,
        items: [
            {type:'button', label:'OPTIONS', onClick: () => pushMenu('options')},
            {type:'button', label:'HELP',    onClick: () => pushMenu('help')},
        ],
        // Show the title immediately instead of waiting for a click. Audio
        // is still gated by browser policy until the first user interaction.
        revealOnClick: false,
        onPlay: () => { gameReset(); setPlaying(true); },
    });

    createOptionsMenu();

    createMenu({
        id: 'help',
        title: 'HELP',
        onHide: popMenu,
        items: [
            {type:'text', text:'Swap neighboring gems to line up three or more of a kind ' +
                'and clear them. Set up chains and cascades to multiply your score.'},
            {type:'text', text:'Drag to swap gems · matches clear automatically'},
            {type:'separator'},
            {type:'button', label:'BACK', onClick: () => hideMenu('help')},
        ],
    });

    createPauseMenu({
        onRestart: gameReset,
        onQuit: () =>
        {
            clearSubmenuStack();
            hideAllMenus();
            setPlaying(false);
            // Reset before showing title so the menu backdrop
            // doesn't reveal a half-cleared board mid-cascade.
            gameReset();
            showMenu('title');
        },
        extraItems: [
            {type:'button', label:'OPTIONS', onClick: () => pushMenu('options')},
        ],
    });

    installDefaultToolbar({landscapeStack:true});

    // No attachClickToReveal — surface the title menu right away.
    showMenu('title');

    if (inCabinet)
    {
        // self-run the auto-solver demo behind the (hidden) menu chrome
        gameReset();
        setPlaying(true);
        if (typeof hideAllMenus === 'function') hideAllMenus();
    }
}

///////////////////////////////////////////////////////////////////////////////
function gameReset()
{
    engineObjectsDestroy();

    // Fill the board avoiding any starting 3-in-a-row, so the title-screen
    // backdrop sits still and the first move belongs to the player.
    level = [];
    const pos = vec2();
    for (pos.y = 0; pos.y < levelSize.y; ++pos.y)
    for (pos.x = 0; pos.x < levelSize.x; ++pos.x)
    {
        let t;
        do {
            t = randInt(tileTypeCount);
        } while (
            pos.x >= 2 && getTile(vec2(pos.x-1, pos.y)) === t
                       && getTile(vec2(pos.x-2, pos.y)) === t
         || pos.y >= 2 && getTile(vec2(pos.x, pos.y-1)) === t
                       && getTile(vec2(pos.x, pos.y-2)) === t
        );
        setTile(pos, t);
    }

    comboCount = score = 0;
    fallTimer = new Timer;
    dragStartPos = 0;
    levelFall = [];
    swapAnim = null;
    clearAnim = null;
    scorePopups = [];
    comboBanner = null;
}

///////////////////////////////////////////////////////////////////////////////
// Cabinet demo: read-only check for any 3-in-a-row anywhere on the visible board.
function boardHasMatch()
{
    const pos = vec2();
    for (pos.y = 0; pos.y < levelSize.y; pos.y++)
    for (pos.x = 0; pos.x < levelSize.x - 2; pos.x++)
    {
        const t = getTile(pos);
        if (t >= 0 && t == getTile(pos.add(vec2(1,0))) && t == getTile(pos.add(vec2(2,0))))
            return true;
    }
    for (pos.x = 0; pos.x < levelSize.x; pos.x++)
    for (pos.y = 0; pos.y < levelSize.y - 2; pos.y++)
    {
        const t = getTile(pos);
        if (t >= 0 && t == getTile(pos.add(vec2(0,1))) && t == getTile(pos.add(vec2(0,2))))
            return true;
    }
    return false;
}

// Cabinet demo: find a random adjacent swap that would create a match (or null).
function findDemoSwap()
{
    const candidates = [], pos = vec2();
    for (pos.x = 0; pos.x < levelSize.x; pos.x++)
    for (pos.y = 0; pos.y < levelSize.y; pos.y++)
    {
        const a = getTile(pos);
        if (a < 0) continue;
        for (const d of [vec2(1,0), vec2(0,1)])
        {
            const bPos = pos.add(d);
            if (!bPos.arrayCheck(levelSize)) continue;
            const b = getTile(bPos);
            if (b < 0) continue;
            setTile(pos, b); setTile(bPos, a);   // simulate the swap
            const ok = boardHasMatch();
            setTile(pos, a); setTile(bPos, b);   // restore
            if (ok) candidates.push({ a: pos.copy(), b: bPos.copy() });
        }
    }
    return candidates.length ? candidates[randInt(candidates.length)] : null;
}

function gameUpdate()
{
    if (!isPlaying()) return;
    if (bindPauseKey({when: () => isPlaying()})) return;

    // Swap animation: visuals slide first, level data swaps at the end. If no
    // match results, the data swap is undone and a reverse animation plays.
    if (swapAnim)
    {
        swapAnim.t += timeDelta;
        if (swapAnim.t >= swapTime)
        {
            if (!swapAnim.reversing)
            {
                const aPos = swapAnim.a, bPos = swapAnim.b;
                const aData = getTile(aPos), bData = getTile(bPos);
                setTile(aPos, bData);
                setTile(bPos, aData);
                const matches = findMatchedTiles();
                if (matches.length)
                {
                    // Valid swap — kick off the flash/swell, then burst & fall.
                    swapAnim = null;
                    startClear(matches);
                }
                else
                {
                    sound_badMove.play();
                    setTile(aPos, aData);
                    setTile(bPos, bData);
                    swapAnim.reversing = true;
                    swapAnim.t = 0;
                }
            }
            else
            {
                swapAnim = null;
            }
        }
        return;
    }

    // Matched gems flash & swell, then burst and trigger the fall.
    if (clearAnim)
    {
        clearAnim.t += timeDelta;
        if (clearAnim.t >= clearTime)
            finalizeClear();
        return;
    }

    if (fallTimer.isSet())
    {
        if (fallTimer.elapsed())
        {
            // refill the top row so falling tiles have something to draw from
            for (let x = 0; x < levelSize.x; ++x)
                setTile(vec2(x, levelSize.y), randInt(tileTypeCount));
        }

        if (!fallTimer.active())
        {
            levelFall = [];
            let keepFalling = 0;
            const pos = vec2();
            for (pos.x = levelSize.x; pos.x--;)
            for (pos.y = 0; pos.y < levelSize.y; pos.y++)
            {
                const data = getTile(pos);
                const abovePos = pos.add(vec2(0, 1));
                const aboveData = getTile(abovePos);
                if (data == -1 && aboveData >= 0)
                {
                    setTile(pos, aboveData);
                    setTile(abovePos, -1);
                    levelFall[pos.x + pos.y * levelSize.x] = keepFalling = 1;
                }
            }

            if (keepFalling)
            {
                // bigger combos fall faster
                const p = percent(comboCount, 9, 0);
                fallTimer.set(fallTime * p);
                sound_fall.play();
            }
            else
                fallTimer.unset();
        }
    }
    else
    {
        // A fall just settled — look for cascade matches and chain another clear.
        const matches = findMatchedTiles();
        if (matches.length)
        {
            startClear(matches);
            return;
        }
        comboCount = 0;   // no more matches — the combo chain ends

        // Cabinet (#demo): the auto-solver makes the moves; humans use the mouse.
        if (inCabinet)
        {
            if (!fallTimer.isSet())
            {
                demoMoveTimer -= timeDelta;
                if (demoMoveTimer <= 0)
                {
                    const mv = findDemoSwap();
                    if (mv) swapAnim = { a: mv.a, b: mv.b, t: 0, reversing: false };
                    else gameReset();   // no moves left — reshuffle the board
                    demoMoveTimer = .5;
                }
            }
            return;   // skip mouse input + best-score submit in the demo
        }

        if (!fallTimer.isSet())
        {
            const mouseTilePos = mousePos.floor();
            if (!mousePos.arrayCheck(levelSize))
            {
                dragStartPos = 0;
            }
            else if (mouseWasPressed(0) && !dragStartPos)
            {
                dragStartPos = mouseTilePos.copy();
            }
            else if (mouseIsDown(0) && dragStartPos)
            {
                const dx = abs(dragStartPos.x - mouseTilePos.x);
                const dy = abs(dragStartPos.y - mouseTilePos.y);
                if (dx == 1 && dy == 0 || dx == 0 && dy == 1)
                {
                    const startTile = getTile(dragStartPos);
                    const endTile   = getTile(mouseTilePos);
                    if (startTile >= 0 && endTile >= 0)
                    {
                        // Kick off the slide animation; the actual data swap
                        // (and match check) runs when the animation completes.
                        swapAnim = { a: dragStartPos.copy(), b: mouseTilePos.copy(), t: 0, reversing: false };
                        dragStartPos = 0;
                    }
                }
            }
            else
                dragStartPos = 0;
        }
    }

    if (!inCabinet) submitBestScore(score);   // the demo never banks a best

    if (keyWasPressed('KeyR'))
        gameReset();
}

///////////////////////////////////////////////////////////////////////////////
function gameUpdatePost()
{
    // advance floating score popups and the combo banner
    for (const p of scorePopups) p.t += timeDelta;
    scorePopups = scorePopups.filter(p => p.t < p.life);
    if (comboBanner)
    {
        comboBanner.t += timeDelta;
        if (comboBanner.t >= comboBanner.life)
            comboBanner = null;
    }

    // decay the cascade background flare
    bgPulse = max(0, bgPulse - timeDelta * 1.8);
}

///////////////////////////////////////////////////////////////////////////////
// Faint rays radiating from behind the board, slowly rotating — they speed up
// and brighten on combos via bgPulse. Layered over the gradient backdrop.
function drawBgSunburst()
{
    const c = cameraPos.subtract(cameraOffset);
    const rays = 16, len = 30, width = .6;
    const rot = time * (.05 + bgPulse * .1);
    const pulse = 1 + bgPulse;
    const hue = mod(.62 + time * .02, 1);
    for (let i = 0; i < rays; ++i)
    {
        const a = rot + i * PI / rays;
        const bright = (i % 2 ? .07 : .035) * pulse;
        drawRect(c, vec2(len, width), hsl(hue, .6, .65, min(bright, .5)), a);
    }
}

///////////////////////////////////////////////////////////////////////////////
// Animated vertical gradient backdrop: blue low -> purple/magenta high, with a
// slow hue drift and gentle shimmer so the board never sits on dead black.
function bgColorAt(p)
{
    const hue = mod(.60 + .24 * p + .03 * sin(time * .4) + time * .015, 1);
    const light = lerp(.22, .05, p);   // brighter near the board base
    return hsl(hue, .65, light);
}

function drawBackgroundGradient()
{
    const camSize = getCameraSize();
    const bot = cameraPos.y - camSize.y / 2;
    const top = cameraPos.y + camSize.y / 2;
    const strips = 40, h = camSize.y / strips;
    for (let i = 0; i < strips; ++i)
    {
        const p = i / (strips - 1);
        drawRect(vec2(cameraPos.x, lerp(bot, top, p)),
            vec2(camSize.x + 2, h + .1), bgColorAt(p));
    }
}

function gameRender()
{
    // Re-fit every frame so resizing the window keeps the grid in view.
    fitCamera();

    // animated gradient backdrop + rotating sunburst rays
    drawBackgroundGradient();
    drawBgSunburst();

    // playfield panel — translucent so the gradient glows through the gem gaps
    drawRect(cameraPos.subtract(cameraOffset), levelSize.add(vec2(.15)), rgb(0,0,0,.55));

    // Smoothstep-eased progress along the active swap (0 → 1 forward, 1 → 0 reversing).
    let swapProgress = 0;
    if (swapAnim)
    {
        const t01 = min(swapAnim.t / swapTime, 1);
        const ease = smoothStep(t01);
        swapProgress = swapAnim.reversing ? 1 - ease : ease;
    }

    const pos = vec2();
    for (pos.x = levelSize.x; pos.x--;)
    for (pos.y = levelSize.y; pos.y--;)
    {
        const data = getTile(pos);
        if (data == -1) continue;

        let drawPos = pos.add(vec2(.5));

        // highlight the tile the player has grabbed
        if (dragStartPos && pos.x == dragStartPos.x && pos.y == dragStartPos.y)
            drawRect(drawPos, vec2(1.05));

        // animate falling tiles in
        if (fallTimer.active() && levelFall[pos.x + pos.y * levelSize.x])
            drawPos.y += 1 - fallTimer.getPercent();

        // slide the two swapping tiles toward each other (and back if reversing)
        if (swapAnim)
        {
            if (pos.x === swapAnim.a.x && pos.y === swapAnim.a.y)
                drawPos = swapAnim.a.lerp(swapAnim.b, swapProgress).add(vec2(.5));
            else if (pos.x === swapAnim.b.x && pos.y === swapAnim.b.y)
                drawPos = swapAnim.b.lerp(swapAnim.a, swapProgress).add(vec2(.5));
        }

        // matched gems flash toward white and swell during the clear beat
        let gemColor = tileColors[data], drawScale = 1;
        if (clearAnim && clearAnim.flags[pos.x + pos.y * levelSize.x])
        {
            const k = min(clearAnim.t / clearTime, 1);
            drawScale = 1 + .6 * k;
            gemColor = gemColor.lerp(hsl(0, 0, 1), .7 * k);
        }
        drawRect(drawPos, vec2(.95 * drawScale), gemColor);

        // tint the icon a touch darker so it reads on the gem-colored bg
        const iconColor = gemColor.scale(.7, 1);
        drawTile(drawPos, vec2(.75 * drawScale), gemSprites[data], iconColor);
    }

    // mask the column of tiles spawned above the top so they slide in cleanly
    drawRect(cameraPos.subtract(cameraOffset).add(vec2(0, levelSize.y)),
        levelSize, bgColorAt(1));
}

///////////////////////////////////////////////////////////////////////////////
function gameRenderPost()
{
    if (!isPlaying()) return;
    // Centered below the board, in the score-line padding (arenaSize adds
    // 2 world units below the grid). Anchored to the board so it stays in
    // the right place if gridSize changes.
    drawText('Score: ' + score, vec2(gridSize.x/2, -.9), 1.1, hsl(), .1);

    // floating "+N" popups rise from the match and fade
    for (const pop of scorePopups)
    {
        const k = pop.t / pop.life;
        const alpha = 1 - k * k;
        const size = 1.1 + .5 * k;
        drawText(pop.text, pop.pos.add(vec2(0, k * 1.4)), size,
            pop.color.scale(1, alpha), .12, rgb(0, 0, 0, alpha));
    }

    // combo banner punches in near the top on a 2+ chain
    if (comboBanner)
    {
        const k = comboBanner.t / comboBanner.life;
        const punch = 1 + .35 * Math.exp(-comboBanner.t * 9);   // quick scale pop
        const alpha = 1 - clamp((k - .65) / .35, 0, 1);          // fade out late
        drawTextScreen('COMBO x' + comboBanner.n + '!',
            vec2(mainCanvasSize.x / 2, mainCanvasSize.y * .28), 70 * punch,
            hsl(mod(time * .6, 1), .9, .6, alpha), 5, rgb(0, 0, 0, alpha));
    }
}

///////////////////////////////////////////////////////////////////////////////
// Find all tiles that are part of a run of 3+ in any row or column.
// Returns an array of positions (empty if there are no matches).

function findMatchedTiles()
{
    const removeTiles = [], pos = vec2();

    // horizontal runs
    for (pos.y = levelSize.y; pos.y--;)
    {
        let runCount, runData;
        for (pos.x = levelSize.x; pos.x--;)
        {
            const data = getTile(pos);
            if (data >= 0 && data == runData)
            {
                for (let i = ++runCount; runCount >= minMatchCount && i--;)
                    removeTiles[pos.x + i + pos.y * levelSize.x] = 1;
            }
            else
            {
                runData = data;
                runCount = 1;
            }
        }
    }

    // vertical runs
    for (pos.x = levelSize.x; pos.x--;)
    {
        let runCount, runData;
        for (pos.y = levelSize.y; pos.y--;)
        {
            const data = getTile(pos);
            if (data >= 0 && data == runData)
            {
                for (let i = ++runCount; runCount >= minMatchCount && i--;)
                    removeTiles[pos.x + (pos.y + i) * levelSize.x] = 1;
            }
            else
            {
                runData = data;
                runCount = 1;
            }
        }
    }

    // collect flagged tiles in one pass so L / T shapes resolve as one group
    const list = [], pos2 = vec2();
    for (pos2.x = levelSize.x; pos2.x--;)
    for (pos2.y = levelSize.y; pos2.y--;)
        if (removeTiles[pos2.x + pos2.y * levelSize.x])
            list.push(pos2.copy());
    return list;
}

///////////////////////////////////////////////////////////////////////////////
// Begin the flash/swell beat for a set of matched tiles. The tiles aren't
// removed until finalizeClear() runs when the beat ends.

function startClear(list)
{
    // rising pitch as the cascade chain grows (comboCount = chains resolved so far)
    sound_goodMove.play(0, 1, 1 + comboCount * .12);

    const flags = [];
    for (const p of list)
        flags[p.x + p.y * levelSize.x] = 1;
    clearAnim = {list, t:0, flags};
}

///////////////////////////////////////////////////////////////////////////////
// End the clear beat: burst the matched tiles, score them, and start the fall.

function finalizeClear()
{
    const list = clearAnim.list;
    clearAnim = null;

    let removedCount = 0, sumX = 0, sumY = 0;
    for (const p of list)
    {
        const data = getTile(p);
        if (data < 0) continue;
        ++removedCount;
        sumX += p.x; sumY += p.y;
        setTile(p, -1);
        emitBurst(p, data);
    }

    if (removedCount)
    {
        const gained = ++comboCount * removedCount;
        score += gained;
        bgPulse = min(2.5, bgPulse + .5 + .2 * comboCount);   // flare the background

        // floating "+N" at the centroid of the cleared group
        const center = vec2(sumX / removedCount + .5, sumY / removedCount + .5);
        scorePopups.push({
            pos: center,
            text: '+' + gained,
            t: 0, life: .9,
            color: comboCount >= 2 ? hsl(.12, 1, .6) : hsl(0, 0, 1),
        });
        if (comboCount >= 2)
            comboBanner = {n: comboCount, t: 0, life: 1};

        fallTimer.set();
        levelFall = [];
    }
}

///////////////////////////////////////////////////////////////////////////////
// Spark burst + white core flash when a gem clears (additive, so it glows).

function emitBurst(pos, data)
{
    const c = pos.add(vec2(.5));
    const color1 = tileColors[data];
    const color2 = color1.lerp(hsl(), .5);

    // colored sparks
    new ParticleEmitter(
        c, 0,
        .3, .1, 300, 3.14,
        0,
        color1, color2,
        color1.scale(1, 0), color2.scale(1, 0),
        .6, .4, .05, .18, .1,
        .96, 1, .8, 3.14, .1,
        .5, 0, 1
    );

    // white core flash
    new ParticleEmitter(
        c, 0,
        .1, .05, 120, 3.14,
        0,
        hsl(0,0,1), hsl(0,0,1),
        hsl(0,0,1,0), hsl(0,0,1,0),
        .25, .55, 0, .08, 0,
        .9, 1, 0, 3.14, .2,
        .3, 0, 1
    );
}

///////////////////////////////////////////////////////////////////////////////
engineInit(gameInit, gameUpdate, gameUpdatePost, gameRender, gameRenderPost);
</script></body></html>
