<!DOCTYPE html><head>
<title>Blastman</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<script src="../templates/engineLoader.js"></script>
<script src="../templates/menus.js"></script>
<script src="../templates/gameFx.js"></script>
<script src="../templates/textureGenerator.js"></script>
<script>
'use strict';

// on-screen touch gamepad: left stick to move, one face button to drop bombs
touchGamepadEnable = true;
touchGamepadAnalog = true;
touchGamepadButtonCount = 1;

///////////////////////////////////////////////////////////////////////////////
// constants

const LEVEL_W = 15, LEVEL_H = 13;              // arena size including solid border
const TT = {EMPTY:0, HARD:1, SOFT:2, BOMB:3};  // tile types in collision data
const BOMB_FUSE  = 2.5;    // seconds until a bomb explodes
const FLAME_TIME = .4;     // seconds a flame cell burns
const STAGE_TIME = 180;    // stage timer in seconds
const MOVE_SPEED  = .085;  // player speed, world units per frame
const ASSIST_SPEED = .06;  // corner-assist perpendicular nudge, per frame

///////////////////////////////////////////////////////////////////////////////
// state

let icons;                 // default-atlas name -> TileInfo map
let collisionLayer;        // TileCollisionLayer, the authoritative solids grid
let player;                // Player EngineObject (created in gameInit)
let enemies = [];          // Enemy cell-walkers
let bombs = [];            // {x, y, range, timer}
let flames = new Map();    // cellKey -> Timer
let powerups = new Map();  // cellKey -> 'bomb' | 'fire'  (revealed, collectible)
let hiddenPowerups = new Map(); // cellKey -> type, still under a soft block
let doorCell = null;       // vec2 cell hiding the exit door
let doorRevealed = false;  // soft block over the door destroyed
let doorOpen = false;      // all enemies dead
let stage = 1, score = 0;
let bombCount = 1, fireRange = 2;   // run-persistent power-up state
let stageTimer, deathTimer, gameOverMsg;

const cellKey = (x, y) => x + ',' + y;

function getTile(x, y)
{
    if (x < 0 || y < 0 || x >= LEVEL_W || y >= LEVEL_H)
        return TT.HARD;
    return collisionLayer.getCollisionData(vec2(x, y));
}

function setTile(x, y, t) { collisionLayer.setCollisionData(vec2(x, y), t); }

///////////////////////////////////////////////////////////////////////////////
// sfx (SoundGenerator from gameFx.js)

const sfxPlace     = new SoundGenerator({volume:.4,  frequency:220, attack:0, release:.08, shapeCurve:.5, slide:-.5});
const sfxBoom      = new SoundGenerator({volume:.7,  frequency:90,  attack:0, release:.5,  shapeCurve:.4, slide:-.6, noise:1});
const sfxPickup    = new SoundGenerator({volume:.5,  frequency:520, attack:0, release:.15, pitchJump:260, pitchJumpTime:.06});
const sfxEnemyDie  = new SoundGenerator({volume:.5,  frequency:300, attack:0, release:.2,  slide:-1, noise:.3});
const sfxPlayerDie = new SoundGenerator({volume:.6,  frequency:400, attack:0, release:.6,  slide:-1.5, noise:.2});
const sfxDoor      = new SoundGenerator({volume:.55, frequency:440, attack:0, release:.3,  pitchJump:220, pitchJumpTime:.1});
const sfxMenuSelect   = new SoundGenerator({volume:.3,  frequency:600, attack:0, release:.04, shapeCurve:1.5});
const sfxMenuActivate = new SoundGenerator({volume:.35, frequency:800, attack:0, release:.08, pitchJump:200, pitchJumpTime:.03});

///////////////////////////////////////////////////////////////////////////////
// player

class Player extends EngineObject
{
    constructor(pos)
    {
        super(pos, vec2(.8)); // slightly under a cell so corridors forgive
        this.setCollision(false, false, true, false); // tiles only
        // custom feel: engine resolves collision, we own all motion
        this.damping = 1;
        this.friction = 1;
        this.restitution = 0;
        this.gravityScale = 0;
        this.dead = false;
        this.bombPass = null; // cell of a just-placed bomb we may still stand on
    }

    collideWithTile(tileData, pos)
    {
        // pos is the tile's integer corner. The bomb we just placed stays
        // passable until we step off its cell.
        if (tileData == TT.BOMB && this.bombPass
            && pos.x == this.bombPass.x && pos.y == this.bombPass.y)
            return false;
        return tileData > TT.EMPTY;
    }

    // returns true if the cell blocks the player right now
    isSolidTo(x, y)
    {
        const t = getTile(x, y);
        if (t == TT.BOMB && this.bombPass
            && this.bombPass.x == x && this.bombPass.y == y)
            return false;
        return t > TT.EMPTY;
    }

    cornerAssist(move)
    {
        // Classic Bomberman assist: while moving along one axis, steer the
        // other axis toward the open corridor so corners never snag.
        const cx = this.pos.x|0, cy = this.pos.y|0;
        if (move.x)
        {
            const offY = this.pos.y - (cy + .5);
            if (!this.isSolidTo(cx + move.x, cy))
                this.velocity.y = clamp(-offY, -ASSIST_SPEED, ASSIST_SPEED);
            else if (offY > .2 && !this.isSolidTo(cx + move.x, cy + 1) && !this.isSolidTo(cx, cy + 1))
                this.velocity.y = ASSIST_SPEED;    // slide up into the open row
            else if (offY < -.2 && !this.isSolidTo(cx + move.x, cy - 1) && !this.isSolidTo(cx, cy - 1))
                this.velocity.y = -ASSIST_SPEED;   // slide down into the open row
        }
        else if (move.y)
        {
            const offX = this.pos.x - (cx + .5);
            if (!this.isSolidTo(cx, cy + move.y))
                this.velocity.x = clamp(-offX, -ASSIST_SPEED, ASSIST_SPEED);
            else if (offX > .2 && !this.isSolidTo(cx + 1, cy + move.y) && !this.isSolidTo(cx + 1, cy))
                this.velocity.x = ASSIST_SPEED;
            else if (offX < -.2 && !this.isSolidTo(cx - 1, cy + move.y) && !this.isSolidTo(cx - 1, cy))
                this.velocity.x = -ASSIST_SPEED;
        }
    }

    update()
    {
        this.velocity = vec2();
        if (isPlaying() && !this.dead)
        {
            // 4-way movement on the dominant input axis, like the classics
            const dir = keyDirection().add(gamepadStick(0)).clampLength(1);
            const move = vec2();
            if (dir.x || dir.y)
            {
                if (abs(dir.x) >= abs(dir.y))
                    move.x = sign(dir.x);
                else
                    move.y = sign(dir.y);
            }
            this.velocity = move.scale(MOVE_SPEED);
            this.cornerAssist(move);
        }

        // pass-through expires once we leave the bomb's cell
        if (this.bombPass
            && ((this.pos.x|0) != this.bombPass.x || (this.pos.y|0) != this.bombPass.y))
            this.bombPass = null;

        super.update(); // engine applies velocity + resolves tile collision
    }

    render()
    {
        if (this.dead && oscillate(8) < .5)
            return; // death blink
        const p = this.pos;
        drawTile(p, vec2(.95), icons.pentagon, hsl(.55, .5, .8));
        drawCircle(p.add(vec2(-.14, .1)), .13, hsl(0, 0, .1));
        drawCircle(p.add(vec2( .14, .1)), .13, hsl(0, 0, .1));
    }
}

///////////////////////////////////////////////////////////////////////////////
// bombs & flames

function placeBomb()
{
    const x = player.pos.x|0, y = player.pos.y|0;
    if (bombs.length >= bombCount || getTile(x, y) != TT.EMPTY)
        return;
    setTile(x, y, TT.BOMB);
    bombs.push({x, y, range: fireRange, timer: new Timer(BOMB_FUSE)});
    player.bombPass = {x, y};
    sfxPlace.play(vec2(x + .5, y + .5));
}

function addFlame(x, y)
{
    const k = cellKey(x, y);
    flames.set(k, new Timer(FLAME_TIME));
    powerups.delete(k); // flames burn exposed pickups — classic risk
}

function destroySoft(x, y)
{
    setTile(x, y, TT.EMPTY);
    score += 10;
    const k = cellKey(x, y);
    if (hiddenPowerups.has(k))
    {
        powerups.set(k, hiddenPowerups.get(k));
        hiddenPowerups.delete(k);
    }
    if (doorCell && doorCell.x == x && doorCell.y == y)
        doorRevealed = true;
}

function explodeBomb(b)
{
    const i = bombs.indexOf(b);
    if (i < 0)
        return; // already chained away this frame
    bombs.splice(i, 1);
    setTile(b.x, b.y, TT.EMPTY);
    addFlame(b.x, b.y);

    for (const d of [vec2(1,0), vec2(-1,0), vec2(0,1), vec2(0,-1)])
    for (let r = 1; r <= b.range; ++r)
    {
        const x = b.x + d.x*r, y = b.y + d.y*r;
        const t = getTile(x, y);
        if (t == TT.HARD)
            break;
        if (t == TT.SOFT)
        {
            // flame first so the reveal survives the revealing blast
            // (later blasts still burn exposed pickups via addFlame)
            addFlame(x, y);
            destroySoft(x, y);
            break; // blast is absorbed by the block
        }
        if (t == TT.BOMB)
        {
            const other = bombs.find(o => o.x == x && o.y == y);
            if (other)
                explodeBomb(other); // instant chain reaction
            break;
        }
        addFlame(x, y);
    }

    sfxBoom.play(vec2(b.x + .5, b.y + .5));
    addScreenShake(.3, .25);
    burstFx(vec2(b.x + .5, b.y + .5), hsl(.08, 1, .6));
}

// small radial one-shot burst (speed is per-FRAME — keep it small)
function burstFx(pos, color)
{
    new ParticleEmitter(
        pos, 0,             // pos, angle
        .3,                 // emitSize
        .08, 200,           // emitTime, emitRate -> ~16 particles
        PI,                 // emitConeAngle (all directions)
        icons.spark,        // tileInfo
        color, color,                                   // colorStartA/B
        color.scale(1, 0), color.scale(1, 0),           // colorEndA/B (alpha to 0)
        .4, .5, .1,         // particleTime, sizeStart, sizeEnd
        .25, .02,           // speed (per frame!), angleSpeed
        .95, 1, 0,          // damping, angleDamping, gravityScale
        PI, .1, .5,         // particleConeAngle, fadeRate, randomness
        false, true);       // collideTiles, additive
}

function killPlayer(msg)
{
    if (player.dead)
        return;
    player.dead = true;
    gameOverMsg = msg;
    deathTimer = new Timer(1.2);
    sfxPlayerDie.play();
    addScreenShake(.5, .4);
}

function openDoor()
{
    doorOpen = true;
    sfxDoor.play();
}

function nextStage()
{
    stage++;
    sfxDoor.play();
    buildStage();
}

///////////////////////////////////////////////////////////////////////////////
// enemies — smooth cell-to-cell walkers, no physics

class Enemy
{
    constructor(cell, type)
    {
        this.cell = cell.copy();          // integer cell we're standing in
        this.pos = cell.add(vec2(.5));    // world position
        this.target = null;               // next cell we're walking to
        this.dir = vec2(0, -1);
        this.type = type;                 // 'wanderer' | 'chaser'
        this.speed = type == 'chaser' ? .05 : .032; // world units per frame
        this.phase = rand(9); // desync the bob animation
    }

    free(c) { return getTile(c.x, c.y) == TT.EMPTY; }

    pickTarget()
    {
        const dirs = [vec2(1,0), vec2(-1,0), vec2(0,1), vec2(0,-1)];

        // chaser: lock onto the player down a clear corridor line
        if (this.type == 'chaser' && !player.dead)
        {
            const px = player.pos.x|0, py = player.pos.y|0;
            for (const d of dirs)
            {
                let c = this.cell.add(d), seen = false;
                while (getTile(c.x, c.y) == TT.EMPTY)
                {
                    if (c.x == px && c.y == py) { seen = true; break; }
                    c = c.add(d);
                }
                if (seen)
                {
                    this.dir = d;
                    this.target = this.cell.add(d);
                    return;
                }
            }
        }

        const open = dirs.filter(d => this.free(this.cell.add(d)));
        if (!open.length)
            return; // boxed in — wait for the walls (or bombs) to change
        const straight = open.find(d => d.x == this.dir.x && d.y == this.dir.y);
        const turns = open.filter(d =>
            (d.x != this.dir.x || d.y != this.dir.y) &&
            (d.x != -this.dir.x || d.y != -this.dir.y));
        let d;
        if (straight && (rand() < .7 || !turns.length))
            d = straight;                       // mostly keep going
        else if (turns.length)
            d = turns[randInt(turns.length)];   // random turn at intersections
        else
            d = open[randInt(open.length)];     // dead end — reverse
        this.dir = d;
        this.target = this.cell.add(d);
    }

    update()
    {
        if (!this.target)
            this.pickTarget();
        if (!this.target)
            return;
        if (!this.free(this.target) && this.pos.distance(this.target.add(vec2(.5))) > .5)
        {
            this.target = null; // bomb dropped in our path — repick from current cell
            return;
        }
        const tc = this.target.add(vec2(.5));
        const delta = tc.subtract(this.pos);
        if (delta.length() <= this.speed)
        {
            this.pos = tc;
            this.cell = this.target.copy();
            this.target = null;
        }
        else
            this.pos = this.pos.add(delta.normalize(this.speed));
    }

    render()
    {
        const bob = .04*Math.sin(time*6 + this.phase);
        const p = this.pos.add(vec2(0, bob));
        if (this.type == 'chaser')
            drawTile(p, vec2(.9), icons.triangle, hsl(0, .75, .55), PI); // points down
        else
            drawTile(p, vec2(.85), icons.circle, hsl(.12, .8, .55));
        const ey = this.type == 'chaser' ? -.08 : .08; // eyes low on the flipped triangle
        for (const sx of [-.14, .14])
        {
            drawCircle(p.add(vec2(sx, ey)), .17, hsl(0, 0, 1));
            drawCircle(p.add(vec2(sx, ey)), .09, hsl(0, 0, .05));
        }
    }
}

///////////////////////////////////////////////////////////////////////////////
// game flow

function buildStage()
{
    // recreate the layer fresh so debug physics sees the new stage
    if (collisionLayer)
        collisionLayer.destroy();
    collisionLayer = new TileCollisionLayer(vec2(), vec2(LEVEL_W, LEVEL_H), null, 0, false);

    bombs = [];
    flames = new Map();
    powerups = new Map();
    hiddenPowerups = new Map();
    doorRevealed = doorOpen = false;
    enemies = [];

    // solid border + classic checkerboard pillars
    for (let x = 0; x < LEVEL_W; ++x)
    for (let y = 0; y < LEVEL_H; ++y)
        if (!x || !y || x == LEVEL_W-1 || y == LEVEL_H-1 || (x%2 == 0 && y%2 == 0))
            setTile(x, y, TT.HARD);

    // soft blocks — density creeps up per stage; spawn corner stays clear
    const softDensity = min(.45 + stage*.02, .6);
    const softCells = [];
    for (let x = 1; x < LEVEL_W-1; ++x)
    for (let y = 1; y < LEVEL_H-1; ++y)
    {
        if (getTile(x, y) != TT.EMPTY)
            continue;
        if ((x <= 2 && y == 1) || (x == 1 && y <= 2))
            continue; // player spawn corner: (1,1) (2,1) (1,2)
        if (rand() < softDensity)
        {
            setTile(x, y, TT.SOFT);
            softCells.push(vec2(x, y));
        }
    }

    // hide the exit door and a few power-ups under random soft blocks
    const pickSoft = () => softCells.splice(randInt(softCells.length), 1)[0];
    doorCell = pickSoft();
    if (!doorCell)
    {
        // pathological empty roll — park an exposed door in the far corner
        doorCell = vec2(LEVEL_W-2, LEVEL_H-2);
        doorRevealed = true;
    }
    const powerupTotal = 2 + (stage & 1);
    for (let i = powerupTotal; i--;)
    {
        const c = pickSoft();
        if (c)
            hiddenPowerups.set(cellKey(c.x, c.y), rand() < .5 ? 'bomb' : 'fire');
    }

    // enemies — count and chaser share creep up per stage, far from spawn
    const enemyCount = min(2 + stage, 8);
    const chaserCount = min(stage >> 1, 4);
    let tries = 999;
    while (enemies.length < enemyCount && tries--)
    {
        const x = randInt(1, LEVEL_W-1), y = randInt(1, LEVEL_H-1);
        if (getTile(x, y) != TT.EMPTY || x + y < 8)
            continue; // keep them away from the spawn corner
        enemies.push(new Enemy(vec2(x, y),
            enemies.length < chaserCount ? 'chaser' : 'wanderer'));
    }

    stageTimer = new Timer(STAGE_TIME);

    if (player)
    {
        player.pos = vec2(1.5, 1.5);
        player.velocity = vec2();
        player.bombPass = null;
    }
}

function resetRun()
{
    stage = 1;
    score = 0;
    bombCount = 1;
    fireRange = 2;
    gameOverMsg = null;
    deathTimer = null;
    if (player)
        player.dead = false;
    buildStage();
}

function startGame()
{
    resetRun();
    setPlaying(true);
}

function endGame(msg)
{
    setPlaying(false);
    showGameOverDialog({
        score,
        won: false,
        extraLines: [...(msg ? [msg] : []), 'Stage ' + stage],
        onContinue: () => quitToTitle(resetRun),
    });
}

///////////////////////////////////////////////////////////////////////////////
async function gameInit()
{
    canvasClearColor = new Color().setHex('#101418');
    setSoundVolume(.8);

    // must precede any menu construction / medal / tweak / save access
    saveDataInit('Blastman');
    setMenuVisibilityCallback(v => paused = v);

    initDrawToTexture();
    icons = initDefaultAtlas();

    setMenuTheme('arcade', {accent:'#ff8822'});
    setMenuSounds({
        select:   () => sfxMenuSelect.play(),
        activate: () => sfxMenuActivate.play(),
    });

    createTitleMenu({
        title: 'BLASTMAN',
        subtitle: 'Bomb the blocks. Blast the baddies.',
        titleFx: {fill:'fire', motion:'float', sparkle:true},
        revealOnClick: false,
        canReveal: () => !isPlaying(),
        showBest: true,
        onPlay: startGame,
        items: [
            {type:'button', label:'OPTIONS', onClick: () => pushMenu('options')},
            {type:'button', label:'HELP',    onClick: () => pushMenu('help')},
        ],
    });

    createOptionsMenu({
        showResetBest: true,
        extraItems: [
            {type:'checkbox', id:'shake', label:'SCREEN SHAKE', value: isScreenShakeEnabled(),
                persist:'shake',
                onChange: v => setScreenShakeEnabled(v)},
        ],
    });

    createMenu({
        id: 'help',
        title: 'HELP',
        onHide: popMenu,
        items: [
            {type:'text', text:'Blast every enemy, then find the exit door ' +
                'hidden under a soft block.\n\nMove: arrows / WASD / stick.\n' +
                'Drop bomb: Space / A button.\n\nGrab power-ups for more bombs ' +
                'and bigger blasts — but watch the clock!'},
            {type:'separator'},
            {type:'button', label:'BACK', onClick: () => hideMenu('help')},
        ],
    });

    createPauseMenu({
        onRestart: startGame,
        onQuit: () => quitToTitle(resetRun),
    });

    installDefaultToolbar();

    player = new Player(vec2(1.5, 1.5));

    // build the arena once so the title menu has a live backdrop
    resetRun();

    showMenu('title');
}

///////////////////////////////////////////////////////////////////////////////
function gameUpdate()
{
    if (bindPauseKey({when: () => isPlaying() && player && !player.dead}))
        return;
    if (!isPlaying())
        return;

    // flames burn out
    for (const [k, t] of flames)
        if (t.elapsed())
            flames.delete(k);

    // bombs: fuse ran out, or a flame touched them (chain)
    for (const b of [...bombs])
        if (b.timer.elapsed() || flames.has(cellKey(b.x, b.y)))
            explodeBomb(b);

    // enemies walk, burn in flames, and kill on contact
    for (const e of [...enemies])
    {
        e.update();
        if (flames.has(cellKey(e.pos.x|0, e.pos.y|0)))
        {
            enemies.splice(enemies.indexOf(e), 1);
            score += 100;
            sfxEnemyDie.play(e.pos);
            burstFx(e.pos, hsl(.12, .9, .6));
            continue;
        }
        if (!player.dead && isOverlapping(player.pos, player.size, e.pos, vec2(.7)))
            killPlayer();
    }
    if (!enemies.length && !doorOpen)
        openDoor();

    if (player.dead)
    {
        if (deathTimer && deathTimer.elapsed())
        {
            deathTimer = null;
            endGame(gameOverMsg);
        }
        return;
    }

    // drop a bomb
    if (keyWasPressed('Space') || gamepadWasPressed(0))
        placeBomb();

    // cell events under the player
    const pk = cellKey(player.pos.x|0, player.pos.y|0);
    if (flames.has(pk))
        killPlayer();

    if (powerups.has(pk))
    {
        if (powerups.get(pk) == 'bomb')
            bombCount++;
        else
            fireRange++;
        powerups.delete(pk);
        score += 50;
        sfxPickup.play(player.pos);
    }

    if (doorOpen && doorRevealed
        && (player.pos.x|0) == doorCell.x && (player.pos.y|0) == doorCell.y)
    {
        nextStage();
        return;
    }

    if (stageTimer.elapsed())
        killPlayer('TIME UP!');
}

function gameUpdatePost()
{
}

///////////////////////////////////////////////////////////////////////////////
function gameRender()
{
    // fit the arena every frame so window resizes just work
    cameraPos = vec2(LEVEL_W/2, LEVEL_H/2 + .5);
    cameraScale = min(mainCanvasSize.x/(LEVEL_W + .5), mainCanvasSize.y/(LEVEL_H + 2.5));

    // arena floor with a subtle checker so movement reads
    drawRect(cameraPos, vec2(LEVEL_W, LEVEL_H), hsl(.35, .2, .22));
    for (let x = 0; x < LEVEL_W; ++x)
    for (let y = 0; y < LEVEL_H; ++y)
    {
        const p = vec2(x + .5, y + .5), t = getTile(x, y);
        if (t == TT.HARD)
        {
            // beveled slab: dark base + lighter face
            drawRect(p, vec2(1), hsl(0, 0, .25));
            drawRect(p.add(vec2(0, .04)), vec2(.88), hsl(0, 0, .42));
        }
        else if (t == TT.SOFT)
            drawTile(p, vec2(.98), icons.roundSquare, hsl(.07, .55, .48));
        else if ((x + y) & 1 && x && y && x < LEVEL_W-1 && y < LEVEL_H-1)
            drawRect(p, vec2(1), hsl(.35, .2, .2));
    }

    // exit door — dark slab, pulsing ring once it's active
    if (doorRevealed)
    {
        const p = doorCell.add(vec2(.5));
        drawRect(p, vec2(.9), hsl(0, 0, .1));
        drawTile(p, vec2(.6 + (doorOpen ? .12*oscillate(1.5) : 0)), icons.ring,
            doorOpen ? hsl(.5, 1, .6) : hsl(0, 0, .3));
    }

    // power-ups: white backdrop tile + colored glyph
    for (const [k, type] of powerups)
    {
        const [x, y] = k.split(',').map(Number);
        const p = vec2(x + .5, y + .5);
        drawTile(p, vec2(.8), icons.roundSquare, hsl(0, 0, .92));
        if (type == 'bomb')
            drawTile(p, vec2(.5), icons.circle, hsl(.6, .8, .45));
        else
            drawTile(p, vec2(.55), icons.bolt, hsl(.05, .9, .5));
    }

    // bombs pulse faster as the fuse runs down
    for (const b of bombs)
    {
        const p = vec2(b.x + .5, b.y + .5);
        const tAge = b.timer.getPercent()*BOMB_FUSE;
        const s = .72 + .12*Math.sin(2*PI*tAge*(1 + tAge));
        drawTile(p, vec2(s), icons.circle, hsl(0, 0, .12));
        drawTile(p.add(vec2(.18, .3)), vec2(.22), icons.spark, hsl(.1, 1, .6));
    }

    // flames grow then shrink over their lifetime
    for (const [k, t] of flames)
    {
        const [x, y] = k.split(',').map(Number);
        const p = vec2(x + .5, y + .5);
        const s = Math.sin(t.getPercent()*PI);
        drawTile(p, vec2(.5 + .7*s), icons.burst, hsl(.09, 1, .55));
        drawTile(p, vec2(.3 + .5*s), icons.glow, hsl(.13, 1, .7, .5));
    }

    for (const e of enemies)
        e.render();
}

function gameRenderPost()
{
    if (!isPlaying())
        return;
    const timeLeft = max(0, Math.ceil(-stageTimer.get()));
    const low = timeLeft <= 30;
    drawTextScreen('SCORE ' + score, vec2(16, 30), 28,
        hsl(0, 0, 1), 3, hsl(0, 0, 0), 'left');
    drawTextScreen('STAGE ' + stage + '   TIME ' + timeLeft, vec2(16, 62), 24,
        low ? hsl(0, .9, .6) : hsl(0, 0, .85), 3, hsl(0, 0, 0), 'left');
    drawTextScreen('BOMBS ' + bombCount + '   FIRE ' + fireRange, vec2(16, 92), 24,
        hsl(0, 0, .85), 3, hsl(0, 0, 0), 'left');
}

///////////////////////////////////////////////////////////////////////////////
engineInit(gameInit, gameUpdate, gameUpdatePost, gameRender, gameRenderPost);
</script></body></html>
