<script>
'use strict';

// engine settings
canvasMaxSize = vec2(2048, 2048);
canvasClearColor = new Color().setHex('#264d40');   // felt green

///////////////////////////////////////////////////////////////////////////////
// Layout (world units, Y-up)
// CARD_SIZE comes from templates/cards.js (default vec2(6, 8.5)).
const COL_PITCH_X   = 7;          // horizontal distance between column anchors
const CARD_PITCH_Y  = 1.6;          // how far DOWN each cascade card sits from the one above it
const TOP_MARGIN    = 1;          // empty felt above the top row of stacks
const DEAL_STAGGER  = 0.02;       // delay between each card popping off the deck (lower = faster)
const DEAL_FLIGHT   = 0.25;       // how long each dealt card takes to fly (and flip) to its spot

///////////////////////////////////////////////////////////////////////////////
// Card model
//
// Card, CardStack, shuffledDeck, drawCardSlot, updateCardTweens and CardHistory
// come from templates/cards.js. This game only defines its own stack types and
// cascade fan layout.
//
// suit: 0=♥ (red), 1=♠ (black), 2=♦ (red), 3=♣ (black)   — `suit % 2 === 0` is red
// value: 0..12 (Ace..King)

const StackType = { Cascade: 0, FreeCell: 1, Foundation: 2 };

// Cascade fan: cards stagger straight down from the anchor (Y-up world).
function cascadeOffset(index)
{
    return vec2(0, -CARD_PITCH_Y * index);
}

///////////////////////////////////////////////////////////////////////////////
// Board layout — recomputed in gameInit (and again on canvas size change).
let layoutTopRowY     = 8;       // anchor y for the top row (free cells / foundations)
let layoutColLeftX    = -24.5;   // anchor x for column 0
let layoutCascadeTopY = -2;      // anchor y for the topmost card of every cascade

function setupLayout()
{
    // Total width: 8 columns at COL_PITCH_X apart, centered on x=0.
    layoutColLeftX    = -((8 - 1) * COL_PITCH_X) / 2;
    layoutTopRowY     = 8;             // arbitrary positive y for the top row
    layoutCascadeTopY = layoutTopRowY - CARD_SIZE.y - 1;  // gap below top row

    // Frame the whole table (top row + 13-card cascade) with a unit of felt on
    // three sides and TOP_MARGIN above (room for the toolbar). cameraFit
    // letterbox-fits the rect; in portrait, where the camera is width-limited,
    // it centers the spare height evenly above and below. In landscape the fit
    // is height-bound and top-anchors exactly as before. Adjust TOP_MARGIN to
    // slide the board up or down on screen.
    const topY    = layoutTopRowY + CARD_SIZE.y/2;
    const bottomY = layoutCascadeTopY - CARD_PITCH_Y * 12 - CARD_SIZE.y/2;
    const cardsW  = (8 - 1) * COL_PITCH_X + CARD_SIZE.x;
    cameraFit(vec2(0, (topY + bottomY)/2), vec2(cardsW, topY - bottomY),
        { top: TOP_MARGIN, right: 1, bottom: 1, left: 1 });
}

function newGame(deck)
{
    cardStacks = [];
    won = false;

    // Top row: 4 free cells (left), 4 foundations (right).
    for (let i = 0; i < 8; ++i)
    {
        const x = layoutColLeftX + i * COL_PITCH_X;
        const type = i < 4 ? StackType.FreeCell : StackType.Foundation;
        cardStacks.push(new CardStack(vec2(x, layoutTopRowY), type));
    }
    // Bottom: 8 cascades.
    for (let i = 0; i < 8; ++i)
    {
        const x = layoutColLeftX + i * COL_PITCH_X;
        cardStacks.push(new CardStack(vec2(x, layoutCascadeTopY), StackType.Cascade, cascadeOffset));
    }

    deck = deck || shuffledDeck();           // demo passes a specific solved deck

    // Deal into cascades: 7,7,7,7,6,6,6,6. FreeCell hides nothing, so every card
    // rests face-up (the deal animation flips them up from the face-down deck).
    const cascades = cardStacks.slice(8);   // 8 cascade stacks
    let idx = 0;
    for (let col = 0; col < 8; ++col)
        for (let row = 0, n = (col < 4 ? 7 : 6); row < n; ++row)
        {
            const card = deck[idx++];
            card.faceUp = true;
            cascades[col].putCardOnTop(card);
        }

    handStack    = new CardStack(vec2(0, 0), StackType.Cascade);  // off-screen until pickup
    pickupOrigin = null;
    history.reset();   // clear undo/redo and seed the initial snapshot

    // Deal-out animation: every card flies off the top-left deck (free cell 0)
    // and flips face-up while flying. Cosmetic only — the board is already
    // logically dealt. Returns its length so the demo can wait for it.
    return dealCards(cardStacks, cardStacks[0].pos, {perCard: DEAL_STAGGER, duration: DEAL_FLIGHT, flip: true});
}

///////////////////////////////////////////////////////////////////////////////
// FREECELL

// HUD toolbar is only meaningful during gameplay. Tracked separately
// because "in a menu" doesn't tell us whether the game has started yet
// (title screen is also a menu, but the HUD shouldn't be available there).
let cardStacks  = [];
let handStack   = null;
let pickupOrigin = null;
let mouseHoldPos = vec2();
let won = false;
let hintsEnabled = true;     // toggled by OPTIONS → HINTS; gates the green legal-drop tint
let lastClick = { card: null, time: -1 };
let history = null;          // CardHistory (created in gameInit)
let demoPlayer = null;       // CardDemoPlayer (created in gameInit only when #demo)

// SoundGenerator options (from templates/gameFx.js):
//   volume, randomness, frequency, attack, release, shapeCurve, slide,
//   pitchJump, pitchJumpTime, repeatTime, noise, bitCrush, delay
// Module-level so the rest of the file (and the demo-triggered game code) can
// reach them; constructed in setupSounds (called from gameInit). Tune by ear.
let sndPickup, sndPlace, sndInvalid, sndFoundation, sndWin;
function setupSounds()
{
    // Match the engine's master volume to whatever the options slider starts at,
    // so the very first menu sound plays at the user-visible volume.
    setSoundVolume(.8);
    sndPickup     = new SoundGenerator({ frequency: 400, attack: 0, release: 0.005, volume: 0.4, noise:2 });
    sndPlace      = new SoundGenerator({ frequency: 200, attack: 0, release: 0.01, volume: 0.4, noise:2 });
    sndInvalid    = new SoundGenerator({ frequency: 110, attack: 0.005, release: 0.14, shapeCurve: 2, noise: 0.4, slide: -2, volume: 0.4 });
    sndFoundation = new SoundGenerator({ frequency: 880, attack: 0.002, release: 0.08, volume: 0.4 });
    sndWin        = new SoundGenerator({ frequency: 440, attack: 0.02, release: 0.5, pitchJump: 660, pitchJumpTime: 0.2, repeatTime: 0.25, volume: 0.5 });
}

async function gameInit()
{
    saveDataInit('freecell');
    setupLayout();
    initCardAtlas();

    // Undo/redo + autosave. snapshot()/loadState() are the game-specific hooks.
    history = new CardHistory({ serialize: snapshot, deserialize: loadState });

    setupSounds();   // builds sndPickup..sndWin — used by both normal play and demo

    // Attract / hero-cabinet mode (#demo): a self-playing AI solves a fresh
    // random deal and plays it out, looping forever. It never reads or writes
    // save data and shows no menus (menus.js already hides chrome in #demo).
    if (isDemoMode())
    {
        history.save = () => {};   // belt-and-suspenders: zero persistence in demo
        setupDemo();               // build the self-player (deals lazily once solved)
        return;
    }

    // Read any in-progress saved game BEFORE newGame() — newGame calls
    // saveState() at the end which overwrites the save data with the
    // fresh-deal snapshot, so we'd otherwise lose the previous session.
    let savedSnap = null;
    const raw = getSaveData().saveState;
    if (raw) savedSnap = raw;

    newGame();

    let resumedGame = false;    // true when an unfinished saved game was restored
    if (savedSnap)
    {
        loadState(savedSnap);   // also recomputes the `won` flag
        if (won)
            newGame();          // saved game was already finished — deal fresh
        else
        {
            history.reset();    // re-seed history + save data with the restored game
            resumedGame = true;
        }
    }

    // Pause whenever a menu is up during a run. Title menu sits over the
    // canvas without freezing anything.
    installAutoPause();

    // ----- title menu -----
    // True only while the title sits over a restored in-progress game (set at
    // startup; cleared once QUIT deals a fresh board). Drives CONTINUE vs PLAY.
    let canResume = resumedGame;
    const playFromTitle = () => { setPlaying(true); hideMenu('title'); };
    setMenuTheme({accent:'#33cc66', font:'Tahoma, Geneva, sans-serif'});
    const titleMenu = createTitleMenu({
        id: 'title',
        title: 'FREECELL',
        titleFx: {fill:'shine', color:'#3c6'},
        onPlay: playFromTitle,
        // the resumed board is already loaded behind the title, so PLAY just
        // starts it — label it CONTINUE when that board is a restored game, and
        // surface NEW GAME beside it so a fresh deal doesn't require continuing
        onShow: () =>
        {
            titleMenu.getItem('play').setLabel(canResume ? 'CONTINUE' : 'PLAY');
            titleMenu.getItem('newGame').setVisible(canResume);
        },
        canReveal: () => !isPlaying(),
        revealOnClick: false,
        items: [
            {type:'button', id:'newGame', label:'NEW GAME',
                onClick: () => { newGame(); canResume = false; setPlaying(true); hideMenu('title'); }},
            {type:'button', label:'OPTIONS', onClick: () => pushMenu('options')},
            {type:'button', label:'HELP',   onClick: () => pushMenu('help')},
        ],
    });
    // NEW GAME only appears alongside CONTINUE; hide it until onShow decides.
    titleMenu.getItem('newGame').setVisible(false);

    // ----- options menu -----
    createOptionsMenu({
        persistKey: 'volume',
        extraItems: [
            {type:'checkbox', id:'hints', label:'HINTS', value: true,
                persist: 'hints',
                onChange: v => { hintsEnabled = v; }},
        ],
    });

    // ----- about menu -----
    createMenu({
        id: 'help',
        title: 'HELP',
        onHide: popMenu,
        items: [
            {type:'text', text:
                'Move all cards to the four foundations, Ace through King by suit. ' +
                'Stack tableau columns down by alternating color; park cards in the free cells temporarily.'},
            {type:'text', text:
                'Click or drag cards to move · Double-click to auto-send to foundation · Z undo · Y redo'},
            {type:'separator'},
            {type:'button', label:'BACK', onClick: () => hideMenu('help')},
        ],
    });

    // ----- HUD toolbar -----
    // Extra game-specific buttons (undo / redo / new) live before the
    // default mute / fullscreen / hamburger trio. They're hidden while
    // at title since there's no game in progress to undo or restart.
    installDefaultToolbar({
        landscapeStack:true,
        extraItemsBefore: [
            {type:'button', id:'undo', label:'↶', title:'Undo (Z)', onClick: undoState},
            {type:'button', id:'redo', label:'↷', title:'Redo (Y)', onClick: redoState},
            {type:'button', id:'new',  label:'⟳', title:'New game', onClick: () =>
                showConfirmDialog({
                    message: 'Abandon this game and start a new one?',
                    onYes: () => newGame(),
                })},
        ],
    });
    addPlayingListener(p =>
    {
        const hud = getToolbar('hud');
        if (!hud) return;
        for (const id of ['undo', 'redo', 'new'])
            hud.getItem(id).setVisible(p);
    });

    // ----- pause menu -----
    createPauseMenu({
        onQuit: () =>
        {
            clearSubmenuStack();
            hideAllMenus();
            newGame();             // reset board so title backdrop is clean
            canResume = false;     // fresh deal behind the title -> PLAY, not CONTINUE
            setPlaying(false);
            showMenu('title');
        },
        extraItems: [
            {type:'button', label:'NEW GAME', onClick: () =>
                showConfirmDialog({
                    message: 'Abandon this game and start a new one?',
                    onYes: () => { newGame(); canResume = false; clearSubmenuStack(); hideAllMenus(); },
                })},
            {type:'button', label:'OPTIONS', onClick: () => pushMenu('options')},
        ],
    });

    // Always surface the title now (no auto-resume). The play button reads
    // CONTINUE over a restored game, or PLAY over the fresh deal.
    showMenu('title');
}

///////////////////////////////////////////////////////////////////////////////
// Input helpers

// Topmost card / empty stack under `worldPoint` (see cardAtPoint in cards.js).
function stackUnderPoint(worldPoint) { return cardAtPoint(cardStacks, worldPoint); }

function getMaxMoveCount(target)
{
    let freeCells = 0, emptyCascades = 0;
    for (const s of cardStacks)
    {
        if (s === target || !s.isEmpty()) continue;
        if      (s.type === StackType.FreeCell) ++freeCells;
        else if (s.type === StackType.Cascade)  ++emptyCascades;
    }
    return (1 + freeCells) * (2 ** emptyCascades);
}

function isMoveLegal(target)
{
    if (!target || handStack.isEmpty()) return false;
    const bottom = handStack.bottomCard();

    // Foundation→anywhere: only legal target is another empty foundation.
    if (handStack.type === StackType.Foundation)
        return target.type === StackType.Foundation && target.isEmpty();

    if (target.type === StackType.FreeCell)
        return handStack.cards.length === 1 && target.isEmpty();

    if (target.type === StackType.Foundation)
    {
        if (handStack.cards.length !== 1) return false;
        const top = target.topCard();
        if (!top) return bottom.value === 0;                                // Ace on empty
        return top.suit === bottom.suit && top.value + 1 === bottom.value;
    }

    // target is Cascade
    if (handStack.cards.length > getMaxMoveCount(target)) return false;
    if (target.isEmpty()) return true;
    const top = target.topCard();
    return (top.suit % 2) !== (bottom.suit % 2) && top.value === bottom.value + 1;
}

// Is the tail of `stack` starting at `card` a valid alternating-color
// descending run? Always true for a single card.
function tailIsValidRun(stack, card)
{
    const i = stack.cards.indexOf(card);
    if (i < 0) return false;
    for (let k = i; k < stack.cards.length - 1; ++k)
    {
        const a = stack.cards[k], b = stack.cards[k + 1];
        if ((a.suit % 2) === (b.suit % 2)) return false;
        if (a.value !== b.value + 1)        return false;
    }
    return true;
}

// Cards that would be picked up if the player clicked on `hit` right now.
// Returns [] if the hit isn't legal to grab. Used by both the hover-tint
// highlight and the grab-cursor logic.
function pickableTail(hit)
{
    if (!hit || !hit.card) return [];
    if (hit.stack.type === StackType.Cascade)
    {
        if (!tailIsValidRun(hit.stack, hit.card)) return [];
        return hit.stack.cards.slice(hit.stack.cards.indexOf(hit.card));
    }
    return hit.card === hit.stack.topCard() ? [hit.card] : [];
}

function trySendHome()
{
    let chain = 0, progressed = true;
    while (progressed)
    {
        progressed = false;

        // Lowest foundation value across all four foundations.
        // An empty foundation counts as -1 so any Ace can go.
        let lowest = 13;
        for (const s of cardStacks)
            if (s.type === StackType.Foundation)
                lowest = min(lowest, s.isEmpty() ? -1 : s.topCard().value);

        for (const s of cardStacks)
        {
            if (s.type === StackType.Foundation || s.isEmpty()) continue;
            const c = s.topCard();
            if (c.value > lowest + 1) continue;     // safe rule

            for (const f of cardStacks)
            {
                if (f.type !== StackType.Foundation) continue;
                const top = f.topCard();
                const fits = top
                    ? (top.suit === c.suit && top.value + 1 === c.value)
                    : (c.value === 0);
                if (fits)
                {
                    s.moveTopCard(f, true);
                    sndFoundation.play(f.topCard().pos, 0.5, 1 + chain * 0.07);
                    ++chain;
                    progressed = true;
                    break;
                }
            }
        }
    }
}

///////////////////////////////////////////////////////////////////////////////
// Total cards currently on the four foundations (52 = a complete game).
function foundationTotal()
{
    let total = 0;
    for (const s of cardStacks)
        if (s.type === StackType.Foundation) total += s.cards.length;
    return total;
}

function checkWin()
{
    if (won) return;
    if (foundationTotal() < 52) return;

    won = true;
    sndWin.play();
    showMenuToast({
        icon:     '🎉',
        title:    'You Win!',
        text:     'Press NEW GAME to play again.',
        duration: 5,
    });
}

// True if any *meaningful* legal move exists from the current position.
// "Meaningful" excludes shuffling cards between free cells and moves out
// of a foundation — neither makes progress. Probes by temporarily
// populating handStack so isMoveLegal can be reused; restores on exit.
function hasLegalMove()
{
    const savedCards = handStack.cards;
    const savedType  = handStack.type;
    let found = false;

    outer:
    for (const src of cardStacks)
    {
        if (src.isEmpty()) continue;
        if (src.type === StackType.Foundation) continue;

        const candidates = src.type === StackType.Cascade
            ? src.cards.filter(c => tailIsValidRun(src, c))
            : [src.topCard()];

        for (const startCard of candidates)
        {
            const startIdx = src.cards.indexOf(startCard);
            handStack.cards = src.cards.slice(startIdx);
            handStack.type  = src.type;

            for (const dst of cardStacks)
            {
                if (dst === src) continue;
                // Skip trivial FC→FC shuffles.
                if (src.type === StackType.FreeCell && dst.type === StackType.FreeCell) continue;
                if (isMoveLegal(dst)) { found = true; break outer; }
            }
        }
    }

    handStack.cards = savedCards;
    handStack.type  = savedType;
    return found;
}

function checkLoss()
{
    if (won) return;
    if (hasLegalMove()) return;
    showMenuToast({
        icon:     '😶',
        title:    'No legal moves',
        text:     'Press Z to undo or use NEW GAME.',
        duration: 5,
    });
}

///////////////////////////////////////////////////////////////////////////////
function snapshot()
{
    return {
        seed: 0,                 // reserved for future seedable startup load
        stacks: cardStacks.map(s => s.cards.map(c => [c.value, c.suit])),
    };
}

function loadState(snap)
{
    if (!snap || !snap.stacks) return;
    for (let i = 0; i < cardStacks.length; ++i)
    {
        const stack = cardStacks[i];
        stack.cards = snap.stacks[i].map(([v, s]) => new Card(v, s, true));   // FreeCell cards are face-up
        stack.relayout();
    }
    // Clear any in-flight tweens — restored positions are authoritative.
    for (const s of cardStacks) for (const c of s.cards) c.tweenFrom = null;
    // Recompute win state from foundation counts (snapshot doesn't store it).
    won = foundationTotal() >= 52;
}

// Thin delegators to the shared CardHistory (cards.js).
function saveState() { history.save(); }
function undoState() { history.undoMove(); }
function redoState() { history.redoMove(); }

///////////////////////////////////////////////////////////////////////////////
function gameUpdate()
{
    // Attract mode drives everything through the self-player; no human input.
    if (isDemoMode()) { demoPlayer && demoPlayer.update(); return; }

    if (bindPauseKey({ when: () => isPlaying() && !won })) return;
    if (!isPlaying() || won) return;

    if (mouseWasPressed(0) && handStack.isEmpty())
    {
        const hit = stackUnderPoint(mousePos);
        if (hit && hit.card)
        {
            // Double-click shortcut: top card → first foundation that accepts it.
            if (hit.card === hit.stack.topCard())
            {
                const now = time;
                const isDouble = lastClick.card === hit.card && (now - lastClick.time) < 0.3;
                lastClick = { card: hit.card, time: now };
                if (isDouble)
                {
                    // Move the single top card into the hand temporarily so isMoveLegal works.
                    const savedType = handStack.type;
                    handStack.type = hit.stack.type;
                    hit.stack.moveTopCard(handStack);
                    let placedTarget = null;
                    for (const f of cardStacks)
                    {
                        if (f.type === StackType.Foundation && isMoveLegal(f))
                        {
                            handStack.moveManyToStack(f, undefined, true);
                            placedTarget = f;
                            break;
                        }
                    }
                    if (!placedTarget) handStack.moveManyToStack(hit.stack);   // put it back
                    handStack.type = savedType;
                    if (placedTarget)
                    {
                        sndPlace.play(placedTarget.topCard().pos);
                        trySendHome(); saveState(); checkWin(); checkLoss();
                    }
                    return;
                }
            }
            // For cascades, allow picking up a tail-run starting at `hit.card`.
            // For other stack types, only the top card is pickable.
            const canPick = hit.stack.type === StackType.Cascade
                ? tailIsValidRun(hit.stack, hit.card)
                : (hit.card === hit.stack.topCard());
            if (canPick)
            {
                pickupOrigin = hit.stack;
                mouseHoldPos = hit.card.pos.subtract(mousePos);
                handStack.type = hit.stack.type;
                // Play BEFORE moveManyToStack so hit.card.pos is still the
                // original cascade slot, not the new handStack position.
                sndPickup.play(hit.card.pos);
                hit.stack.moveManyToStack(handStack, hit.card);
            }
            else if (hit.stack.type === StackType.Cascade)
            {
                sndInvalid.play(hit.card.pos);
            }
        }
    }

    // Drag
    if (!handStack.isEmpty())
    {
        const head = mousePos.add(mouseHoldPos);
        for (let i = 0; i < handStack.cards.length; ++i)
            handStack.cards[i].pos = head.add(vec2(0, -CARD_PITCH_Y * i));
    }

    if (mouseWasReleased(0) && !handStack.isEmpty())
    {
        // Use the top-of-hand card center as the hit point for target search.
        const head = mousePos.add(mouseHoldPos);
        let target = null, bestArea = 0;
        for (const s of cardStacks)
        {
            if (s === pickupOrigin || !isMoveLegal(s)) continue;
            const targetPos = s.topCard() ? s.topCard().pos : s.pos;
            // Overlap area: width and height of intersection rectangle.
            const dx = CARD_SIZE.x - abs(head.x - targetPos.x);
            const dy = CARD_SIZE.y - abs(head.y - targetPos.y);
            if (dx > 0 && dy > 0 && dx * dy > bestArea)
            {
                bestArea = dx * dy;
                target = s;
            }
        }
        const placed = target !== null;
        // Snap-back tweens; drops on a valid target snap instantly because the
        // card is already where the cursor left it.
        handStack.moveManyToStack(target || pickupOrigin, undefined, !placed);
        pickupOrigin = null;
        if (placed)
        {
            sndPlace.play(target.topCard().pos);
            trySendHome(); saveState(); checkWin(); checkLoss();
        }
        else
        {
            sndInvalid.play(mousePos);
        }
    }

    const shift = keyIsDown('ShiftLeft') || keyIsDown('ShiftRight');
    if (keyWasPressed('KeyZ')) shift ? redoState() : undoState();
    if (keyWasPressed('KeyY')) redoState();
}
function gameUpdatePost()
{
    // Recompute camera scale every frame so the table refits if the canvas
    // resizes. setupLayout is cheap — just trig-less arithmetic.
    setupLayout();

    // Release finished tweens (deferred sweep — see cards.js).
    updateCardTweens(cardStacks);

    // Cursor feedback: open hand over a pickable card, closed hand while
    // dragging, default otherwise. setCursor is a LittleJS built-in.
    let cursor = 'default';
    if (isPlaying() && !won)
    {
        if (!handStack.isEmpty())
            cursor = 'grabbing';
        else if (pickableTail(stackUnderPoint(mousePos)).length)
            cursor = 'grab';
    }
    setCursor(cursor);
}

// Draw a card honoring its flip state. FreeCell cards rest face-up; the only
// time a back shows is mid-flip during the opening deal (cards fly face-down off
// the deck and flip up). `tint` is an optional highlight veil.
function drawAnyCard(c, pos, tint)
{
    const opts = {tint};
    let faceUp = c.faceUp;
    if (c.isFlipping()) { opts.squashX = c.flipScaleX(); faceUp = c.flipFaceUp(); }
    if (faceUp) drawCard(pos, c.value, c.suit, opts);
    else        drawCardBack(pos, opts);
}

function gameRender()
{
    if (!cardStacks.length) return;

    // Empty-slot outlines (back layer) — see cardSlotVisible() in cards.js.
    for (const s of cardStacks)
        if (cardSlotVisible(s))
            drawCardSlot(s.pos, s.type === StackType.Foundation);

    // Compute per-card tint for this frame. Color-coded:
    //   blue  = "this would lift if you click" (hover, hand empty)
    //   green = "this is a legal drop target" (dragging)
    const HOVER_TINT = new Color(0.55, 0.8, 1.0, 0.4);
    const DROP_TINT  = new Color(0.3, 1.0, 0.4, 0.4);
    const hoverSet   = (handStack.isEmpty() && isPlaying() && !won)
        ? new Set(pickableTail(stackUnderPoint(mousePos))) : null;
    const dropTops   = new Set();
    if (hintsEnabled && !handStack.isEmpty())
    {
        for (const s of cardStacks)
        {
            if (s === pickupOrigin || !isMoveLegal(s)) continue;
            const top = s.topCard();
            if (top) dropTops.add(top);
        }
    }
    const tintFor = c =>
        dropTops.has(c) ? DROP_TINT :
        (hoverSet && hoverSet.has(c)) ? HOVER_TINT :
        null;

    // Stack cards — non-tweening pass. Tint is applied inside drawCard,
    // immediately after the card content, so each card carries its own
    // highlight instead of relying on a global second pass.
    for (const s of cardStacks)
        for (const c of s.cards)
            if (!c.isTweening())
                drawAnyCard(c, c.pos, tintFor(c));

    // Empty legal-drop slots still need a phantom tint because there's
    // no card to draw the overlay on.
    if (hintsEnabled && !handStack.isEmpty())
    {
        for (const s of cardStacks)
        {
            if (s === pickupOrigin || !isMoveLegal(s) || !s.isEmpty()) continue;
            drawCardShape(s.pos, CARD_SIZE, DROP_TINT);
        }
    }

    // Tweening cards (auto-send-home, snap-back, the opening deal) drawn last so
    // flight paths stay on top. Ordered so the deal peels off the TOP of the deck.
    for (const c of tweeningCardsInDealOrder(cardStacks))
        drawAnyCard(c, c.drawnPos(), null);

    // Hand cards on top with a rounded-card shadow.
    const shadow = new Color(0, 0, 0, 0.35);
    for (const c of handStack.cards)
        drawCardShape(c.pos.add(vec2(0.25, -0.25)),
            CARD_SIZE.add(vec2(0.1, 0.1)), shadow);
    for (const c of handStack.cards)
        drawAnyCard(c, c.pos, null);
}
function gameRenderPost() {}

///////////////////////////////////////////////////////////////////////////////
// DEMO / ATTRACT MODE — self-playing AI (only active when the URL has #demo)
//
// FreecellSolver is a pure, engine-independent FreeCell solver: a weighted-A*
// best-first search with a transposition table and an expansion budget, exposed
// as a stepper so the search can be spread across frames. It operates on an
// abstract 16-stack state that mirrors cardStacks' index order:
//   [0..3] free cells   [4..7] foundations   [8..15] cascades
// so the {from, count, to} move list it returns replays 1:1 on the live board.
//
// Card code 0..51:  suit = code/13|0 (0=H,1=S,2=D,3=C),  value = code%13,
//                   color = suit%2 (matches Card.suit / freecell rules above).
//
// Verified headlessly (local/temp/freecellSolver.js): at weight 6 / cap 8000,
// ~81% of random deals solve in a median ~1100 nodes (~99 moves), and every
// "won" plan was replayed to a real 52-card finish (zero false wins). The demo
// player just discards the unsolvable minority and reshuffles, so the viewer
// only ever sees deals that win.
///////////////////////////////////////////////////////////////////////////////
const FreecellSolver = (function()
{
    const FREE0 = 0, FOUND0 = 4, CASC0 = 8, NCASC = 8;
    const val   = c => c % 13;
    const suit  = c => (c / 13) | 0;
    const color = c => ((c / 13) | 0) % 2;
    const clone = st => st.map(a => a.slice());

    function isSolved(st)
    {
        let n = 0;
        for (let f = FOUND0; f < FOUND0 + 4; ++f) n += st[f].length;
        return n === 52;
    }
    function foundationCount(st)
    {
        let n = 0;
        for (let f = FOUND0; f < FOUND0 + 4; ++f) n += st[f].length;
        return n;
    }
    function canFound(fcol, code)
    {
        if (!fcol.length) return val(code) === 0;          // Ace on empty foundation
        const t = fcol[fcol.length - 1];
        return suit(t) === suit(code) && val(t) + 1 === val(code);
    }
    function foundValueOfSuit(st, s)
    {
        for (let f = FOUND0; f < FOUND0 + 4; ++f)
        {
            const col = st[f];
            if (col.length && suit(col[col.length - 1]) === s)
                return val(col[col.length - 1]);
        }
        return -1;
    }
    // Standard FreeCell "safe autoplay": this card can never again help in the
    // tableau, so sending it home preserves solvability.
    function safeToAutoplay(st, code)
    {
        const v = val(code);
        if (v <= 1) return true;                           // aces & twos always safe
        const c = color(code), s = suit(code);
        let oppMin = 99, sameOther = -1;
        for (let sl = 0; sl < 4; ++sl)
        {
            if (sl === s) continue;
            const fv = foundValueOfSuit(st, sl);
            if ((sl % 2) !== c) oppMin = min(oppMin, fv);
            else                sameOther = fv;
        }
        return oppMin >= v - 1 && sameOther >= v - 2;
    }
    function autoplay(st)
    {
        const moves = [];
        let progressed = true;
        while (progressed)
        {
            progressed = false;
            const sources = [];
            for (let c = FREE0; c < FREE0 + 4; ++c) if (st[c].length) sources.push(c);
            for (let i = CASC0; i < CASC0 + NCASC; ++i) if (st[i].length) sources.push(i);
            for (const sIdx of sources)
            {
                const col = st[sIdx], card = col[col.length - 1];
                if (!safeToAutoplay(st, card)) continue;
                let target = -1;
                for (let f = FOUND0; f < FOUND0 + 4; ++f)
                    if (canFound(st[f], card)) { target = f; break; }
                if (target < 0) continue;
                col.pop();
                st[target].push(card);
                moves.push({ from: sIdx, count: 1, to: target });
                progressed = true;
                break;
            }
        }
        return moves;
    }
    function topRunLength(col)
    {
        const n = col.length;
        if (!n) return 0;
        let len = 1;
        for (let k = n - 1; k > 0; --k)
        {
            const below = col[k - 1], above = col[k];
            if (color(below) !== color(above) && val(below) === val(above) + 1) ++len;
            else break;
        }
        return len;
    }
    function capacity(freeOpen, emptyCascades, exclIdx)
    {
        let ec = emptyCascades.length;
        if (emptyCascades.includes(exclIdx)) --ec;
        return (1 + freeOpen) * (2 ** ec);
    }
    function generateMoves(st)
    {
        const moves = [];
        let freeOpen = 0, firstFree = -1;
        for (let c = FREE0; c < FREE0 + 4; ++c)
            if (!st[c].length) { ++freeOpen; if (firstFree < 0) firstFree = c; }
        const emptyCasc = [];
        for (let i = CASC0; i < CASC0 + NCASC; ++i) if (!st[i].length) emptyCasc.push(i);
        const firstEmptyCasc = emptyCasc.length ? emptyCasc[0] : -1;

        for (let i = CASC0; i < CASC0 + NCASC; ++i)
        {
            const col = st[i], n = col.length;
            if (!n) continue;
            const top = col[n - 1];
            for (let f = FOUND0; f < FOUND0 + 4; ++f)
                if (canFound(st[f], top)) { moves.push({ from: i, count: 1, to: f }); break; }
            if (firstFree >= 0) moves.push({ from: i, count: 1, to: firstFree });

            const R = topRunLength(col);
            // Onto a non-empty column: at most one run length continues a given top.
            for (let j = CASC0; j < CASC0 + NCASC; ++j)
            {
                if (j === i) continue;
                const tcol = st[j];
                if (!tcol.length) continue;
                const t = tcol[tcol.length - 1];
                for (let L = 1; L <= R; ++L)
                {
                    const bottom = col[n - L];
                    if (val(bottom) === val(t) - 1 && color(bottom) !== color(t))
                    {
                        if (L <= capacity(freeOpen, emptyCasc, j))
                            moves.push({ from: i, count: L, to: j });
                        break;
                    }
                }
            }
            // Onto the (interchangeable) first empty column: any suffix run capacity allows.
            if (firstEmptyCasc >= 0)
            {
                const capE = capacity(freeOpen, emptyCasc, firstEmptyCasc);
                for (let L = 1; L <= R && L <= capE; ++L)
                    moves.push({ from: i, count: L, to: firstEmptyCasc });
            }
        }
        for (let c = FREE0; c < FREE0 + 4; ++c)
        {
            const col = st[c];
            if (!col.length) continue;
            const card = col[0];
            for (let f = FOUND0; f < FOUND0 + 4; ++f)
                if (canFound(st[f], card)) { moves.push({ from: c, count: 1, to: f }); break; }
            for (let j = CASC0; j < CASC0 + NCASC; ++j)
            {
                const tcol = st[j];
                if (!tcol.length)
                {
                    if (j === firstEmptyCasc) moves.push({ from: c, count: 1, to: j });
                }
                else
                {
                    const t = tcol[tcol.length - 1];
                    if (color(t) !== color(card) && val(t) === val(card) + 1)
                        moves.push({ from: c, count: 1, to: j });
                }
            }
        }
        return moves;
    }
    function orderMoves(moves, st)
    {
        const scoreOf = m =>
        {
            let s = 0;
            if (m.to >= FOUND0 && m.to < FOUND0 + 4) s += 1000;        // send home
            const src = st[m.from];
            if (m.from >= CASC0 && src.length === m.count) s += 120;   // empties a column
            if (m.to >= CASC0 && st[m.to].length) s += 60;            // builds on a card
            if (m.to >= FREE0 && m.to < FREE0 + 4) s -= 60;           // parking is last resort
            if (m.to >= CASC0 && !st[m.to].length) s -= 15;           // spends an empty column
            return s;
        };
        return moves.map(m => [scoreOf(m), m]).sort((a, b) => b[0] - a[0]).map(p => p[1]);
    }
    function heuristic(st)
    {
        let h = 52 - foundationCount(st);
        for (let s = 0; s < 4; ++s)
        {
            const next = foundValueOfSuit(st, s) + 1;
            if (next > 12) continue;
            const targetCode = s * 13 + next;
            for (let i = CASC0; i < CASC0 + NCASC; ++i)
            {
                const idx = st[i].indexOf(targetCode);
                if (idx >= 0) { h += st[i].length - 1 - idx; break; }
            }
        }
        for (let c = FREE0; c < FREE0 + 4; ++c) if (st[c].length) h += 0.5;
        return h;
    }

    const HASH_SEP = String.fromCharCode(252), HASH_GRP = String.fromCharCode(253);
    function canonicalHash(st)
    {
        const fcc = String.fromCharCode;
        const casc = [];
        for (let i = CASC0; i < CASC0 + NCASC; ++i) casc.push(fcc.apply(null, st[i]));
        const free = [];
        for (let c = FREE0; c < FREE0 + 4; ++c) free.push(fcc.apply(null, st[c]));
        const found = [];
        for (let f = FOUND0; f < FOUND0 + 4; ++f) found.push(fcc.apply(null, st[f]));
        casc.sort(); free.sort(); found.sort();
        return casc.join(HASH_SEP) + HASH_GRP + free.join(HASH_SEP) + HASH_GRP + found.join(HASH_SEP);
    }
    function applyMoveToState(st, m)
    {
        const from = st[m.from], to = st[m.to];
        const moving = from.splice(from.length - m.count);
        for (const c of moving) to.push(c);
    }

    class MinHeap
    {
        constructor() { this.a = []; }
        get size() { return this.a.length; }
        push(item)
        {
            const a = this.a; a.push(item);
            let i = a.length - 1;
            while (i > 0)
            {
                const p = (i - 1) >> 1;
                if (a[p].prio <= a[i].prio) break;
                [a[p], a[i]] = [a[i], a[p]]; i = p;
            }
        }
        pop()
        {
            const a = this.a, top = a[0], last = a.pop();
            if (a.length) { a[0] = last; this._down(0); }
            return top;
        }
        _down(i)
        {
            const a = this.a, n = a.length;
            for (;;)
            {
                let s = i; const l = 2 * i + 1, r = 2 * i + 2;
                if (l < n && a[l].prio < a[s].prio) s = l;
                if (r < n && a[r].prio < a[s].prio) s = r;
                if (s === i) break;
                [a[s], a[i]] = [a[i], a[s]]; i = s;
            }
        }
    }

    // Steppable weighted-A* search. step(budget) returns true when finished;
    // getResult() then yields { moves, won, nodes }.
    function createSolver(initial, opts = {})
    {
        const expandCap = opts.expandCap || 8000;
        const W = opts.weight || 6;

        const root = clone(initial);
        const rootAuto = autoplay(root);
        const rootHash = canonicalHash(root);
        const cameFrom = new Map([[rootHash, { moves: rootAuto, parent: null }]]);
        const gScore   = new Map([[rootHash, rootAuto.length]]);
        const closed   = new Set();
        const open     = new MinHeap();
        const rootH    = heuristic(root);
        open.push({ prio: rootAuto.length + W * rootH, st: root, hash: rootHash, h: rootH });

        let expansions = 0;
        let best = { h: Infinity, hash: rootHash };
        let result = null;

        const buildPath = hash =>
        {
            const out = [];
            for (let h = hash; h !== null; )
            {
                const e = cameFrom.get(h);
                for (let k = e.moves.length - 1; k >= 0; --k) out.push(e.moves[k]);
                h = e.parent;
            }
            return out.reverse();
        };

        function step(budget = 400)
        {
            if (result) return true;
            let count = 0;
            while (open.size && count < budget)
            {
                const cur = open.pop();
                if (closed.has(cur.hash)) continue;
                closed.add(cur.hash);
                ++expansions; ++count;

                if (isSolved(cur.st))
                { result = { moves: buildPath(cur.hash), won: true, nodes: expansions }; return true; }

                if (cur.h < best.h) best = { h: cur.h, hash: cur.hash };
                if (expansions >= expandCap)
                { result = { moves: buildPath(best.hash), won: false, nodes: expansions }; return true; }

                const g = gScore.get(cur.hash);
                const moves = orderMoves(generateMoves(cur.st), cur.st);
                for (const m of moves)
                {
                    const ns = clone(cur.st);
                    applyMoveToState(ns, m);
                    const auto = autoplay(ns);
                    const childMoves = auto.length ? [m, ...auto] : [m];
                    const nh = canonicalHash(ns);
                    if (closed.has(nh)) continue;
                    const ng = g + childMoves.length;
                    if (gScore.has(nh) && gScore.get(nh) <= ng) continue;
                    gScore.set(nh, ng);
                    cameFrom.set(nh, { moves: childMoves, parent: cur.hash });
                    const nHeu = heuristic(ns);
                    open.push({ prio: ng + W * nHeu, st: ns, hash: nh, h: nHeu });
                }
            }
            if (!open.size && !result)
                result = { moves: buildPath(best.hash), won: false, nodes: expansions };
            return result !== null;
        }

        return { step, getResult: () => result };
    }

    // Build the abstract solver state from a freecell deck (array of 52 Card),
    // dealt exactly as newGame deals it: cascades get 7,7,7,7,6,6,6,6.
    function abstractFromDeck(deck)
    {
        const st = [];
        for (let i = 0; i < 16; ++i) st.push([]);
        let idx = 0;
        for (let col = 0; col < 8; ++col)
            for (let row = 0, n = (col < 4 ? 7 : 6); row < n; ++row)
            {
                const c = deck[idx++];
                st[CASC0 + col].push(c.suit * 13 + c.value);
            }
        return st;
    }

    return { createSolver, abstractFromDeck };
})();

// --- Demo pacing (seconds) — tweak these to taste -------------------------
// Two different "speeds":
//   DEMO_TWEEN_TIME — how long a card takes to SLIDE to its new spot (the
//                     animation itself). Raise this to make the cards glide
//                     more slowly. Keep it <= DEMO_MOVE_DELAY so each slide
//                     finishes before the next move starts.
//   DEMO_MOVE_DELAY — the gap between successive moves (the AI's "thinking"
//                     rhythm). At ~99 moves/game, 0.7s ≈ a ~70s game.
const DEMO_TWEEN_TIME  = 1.0;   // card slide animation duration (raise = slower glide)
const DEMO_MOVE_DELAY  = 1.5;   // pause between each card move (raise to slow down)
const DEMO_DEAL_PAUSE  = 1.8;   // hold on a finished game before dealing the next
const DEMO_START_DELAY = 0.7;   // pause after a fresh deal before the first move

// Wire up the attract self-player. Called once from gameInit when #demo is set.
function setupDemo()
{
    let curDeck = null;     // the deck currently being solved / last solved
    let solver  = null;     // active stepper, or null between deals

    // Advance the solver a little each frame. Returns a winning move list once a
    // solvable deal is ready, else null (still searching, or just discarded an
    // unsolvable deal and will start a fresh one next frame).
    const planStep = budget =>
    {
        if (!solver)
        {
            curDeck = shuffledDeck();
            solver = FreecellSolver.createSolver(
                FreecellSolver.abstractFromDeck(curDeck), { weight: 6, expandCap: 8000 });
        }
        if (solver.step(budget))
        {
            const res = solver.getResult();
            solver = null;                       // either way, this attempt is done
            return res.won ? res.moves : null;   // null => discard, reshuffle next frame
        }
        return null;
    };

    // Deal the solved deck onto the live board (move list replays against it),
    // and hold the AI until the opening deal animation finishes.
    const deal = () =>
    {
        const dealTime = newGame(curDeck);
        demoPlayer.startDelay = dealTime + 0.3;
    };

    // Execute one planned move, animated. `count` cards from the top of `from`
    // slide together onto `to` (supermoves are one stack-slide, as requested).
    const applyMove = m =>
    {
        const from = cardStacks[m.from], to = cardStacks[m.to];
        if (!from || !to) return;
        const startIdx = from.cards.length - m.count;
        const startCard = from.cards[startIdx];
        if (!startCard) return;
        // Slow the slide for the demo: each Card tweens for its own tweenDuration
        // (default 0.2s in cards.js), read when the move starts — so set it on the
        // cards about to move before handing them to moveManyToStack.
        for (let k = startIdx; k < from.cards.length; ++k)
            from.cards[k].tweenDuration = DEMO_TWEEN_TIME;
        from.moveManyToStack(to, startCard, true);
        const snd = to.type === StackType.Foundation ? sndFoundation : sndPlace;
        const land = to.topCard();
        if (snd && land) snd.play(land.pos);
    };

    demoPlayer = new CardDemoPlayer({ planStep, deal, applyMove,
        moveDelay: DEMO_MOVE_DELAY, dealPause: DEMO_DEAL_PAUSE, startDelay: DEMO_START_DELAY });
}

///////////////////////////////////////////////////////////////////////////////
engineInit(gameInit, gameUpdate, gameUpdatePost, gameRender, gameRenderPost);
