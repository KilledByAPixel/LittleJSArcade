<!DOCTYPE html><head>
<title>LittleJS Home Run Derby</title>
<meta charset=utf-8>
</head>
<script src="../templates/engineLoader.js?1780767748506"></script>
<script src="../dist/box2d.wasm.js?1780767748506"></script>
<script src="../templates/gameFx.js?1780767748506"></script>
<script src="../templates/textureGenerator.js?1780767748506"></script>
<script src="../templates/menus.js?1780767748506"></script>
<script>
'use strict';

// engine settings
canvasMaxSize = vec2(2048, 2048);

///////////////////////////////////////////////////////////////////////////////
// Top-Down Baseball (Box2D physics, gravity-free 2D field)

// Field layout (Y is north toward pitcher, X is east toward first base)
const platePos      = vec2(0, 0);
const pitcherPos    = vec2(0, 18);
const batterPos     = vec2(-1.4, 0);    // right-handed, 3B side of plate
const catcherPos    = vec2(0, -1.6);
const moundCenter   = vec2(0, 18);
const fenceRadius   = 42;
const backstopY     = -3.0;             // backstop wall south of catcher
const foulAngleHalf = PI/4;             // ±45° from north defines fair territory

// Strike zone (AABB centered at home plate)
const zoneHalf      = vec2(.75, .55);

// Bat & ball
const batLength     = 3.5;
const batThickness  = .25;
const swingDuration = .26;
const ballRadius    = .35;

// Pitch settings
const pitchSpeedMin = 26;
const pitchSpeedMax = 34;

// Game state
let icons;                // default-atlas icon map (name -> TileInfo)
let ball, backstopObj;
let pitchNumber = 0, balls = 0, strikes = 0, hits = 0, perfectHits = 0, homeRuns = 0;
let bestDistance = 0;
let lastResultText = '';
let resultColor = hsl(.14, .9, .7);
let resultTimer = new Timer();
let autoPitchTimer = new Timer();

// 'idle' = ball at pitcher
// 'pitch' = ball flying from pitcher toward plate
// 'play' = ball was hit
let ballState = 'idle';
let pitchOutcomeLocked = false; // strike/ball already decided for current pitch
let zoneEntered = false;        // did pitch pass through strike zone?
let swungAtPitch = false;       // did the player swing during this pitch?

// Aim & swing state
let swingTimer = new Timer();
let swingConnected = false;

// Particles — see puffBurst() below (engine ParticleEmitter bursts).

// Sounds
const sfxSwing   = new SoundGenerator({volume:.45, frequency:170, attack:0, release:.08, slide:.2, shapeCurve:1.5});
const sfxHit     = new SoundGenerator({volume:.6,  frequency:160, attack:0, release:.14, noise:.07, shapeCurve:1.2, slide:.2});
const sfxCrack   = new SoundGenerator({volume:.7,  frequency:380, attack:0, release:.22, noise:.18, shapeCurve:.8, slide:-1});
const sfxStrike  = new SoundGenerator({volume:.42, frequency:90,  attack:0, release:.16, slide:-.4, shapeCurve:2});
const sfxBall    = new SoundGenerator({volume:.32, frequency:380, attack:0, release:.14, slide:-.2, shapeCurve:1.5});
const sfxPitch   = new SoundGenerator({volume:.35, frequency:260, attack:0, release:.08, noise:.1,  slide:-.8});
const sfxCatcher = new SoundGenerator({volume:.4,  frequency:130, attack:0, release:.14, noise:.5,  shapeCurve:2});
const sfxRoll    = new SoundGenerator({volume:.2,  frequency:80,  attack:0, release:.12, noise:.3,  shapeCurve:2});
const sfxHomerun = new SoundGenerator({volume:.55, frequency:520, attack:0, release:.45, slide:.3});

///////////////////////////////////////////////////////////////////////////////
// Helpers

function distPointToSegment(p, a, b)
{
    const ab = b.subtract(a);
    const ap = p.subtract(a);
    const abLen2 = ab.lengthSquared();
    if (abLen2 <= 1e-6) return ap.length();
    const t = clamp(ap.dot(ab) / abLen2, 0, 1);
    return p.distance(a.add(ab.scale(t)));
}

function smoothstep01(t)
{
    return smoothStep(clamp(t, 0, 1));
}

function inStrikeZone(p)
{
    // any part of the ball overlapping the zone counts (matches the visual)
    return abs(p.x - platePos.x) <= zoneHalf.x + ballRadius
        && abs(p.y - platePos.y) <= zoneHalf.y + ballRadius;
}

function inFairTerritory(p)
{
    // fair = angle from +X is between 45° and 135° (north-pointing wedge)
    const a = atan2(p.y, p.x);
    return a > PI/2 - foulAngleHalf && a < PI/2 + foulAngleHalf;
}

///////////////////////////////////////////////////////////////////////////////
// Ball

class Ball extends Box2dObject
{
    constructor()
    {
        super(pitcherPos.copy(), vec2(ballRadius*2), 0, 0, hsl(0, 0, .97));
        this.addCircle(ballRadius*2, vec2(), 1.2, .4, .55);
        this.setBullet(true);
        this.setLinearDamping(.2);
        this.setAngularDamping(.5);
        this.setGravityScale(0); // top-down: no gravity
        this.parkAtMound();
    }

    parkAtMound()
    {
        this.setPosition(pitcherPos.copy());
        this.setLinearVelocity(vec2());
        this.setAngularVelocity(0);
        ballState = 'idle';
        pitchOutcomeLocked = false;
        zoneEntered = false;
        swungAtPitch = false;
    }

    pitch()
    {
        const startPos = pitcherPos.copy();
        this.setPosition(startPos);
        this.setAwake(true);
        swungAtPitch = false;

        // ~65% strikes, ~35% balls (outside the zone)
        const aimStrike = rand() < .65;
        let target;
        if (aimStrike)
        {
            target = vec2(
                rand(-zoneHalf.x*.85, zoneHalf.x*.85),
                rand(-zoneHalf.y*.85, zoneHalf.y*.85));
        }
        else
        {
            // pick a side outside the zone
            const side = randInt(4);
            const wide = vec2(zoneHalf.x + rand(.4, 1.3), rand(-zoneHalf.y*1.2, zoneHalf.y*1.2));
            const high = vec2(rand(-zoneHalf.x*1.2, zoneHalf.x*1.2), zoneHalf.y + rand(.4, 1.0));
            target =
                side === 0 ? wide :
                side === 1 ? vec2(-wide.x, wide.y) :
                side === 2 ? high :
                             vec2(high.x, -high.y);
        }

        const speed = rand(pitchSpeedMin, pitchSpeedMax);
        const dir = target.subtract(startPos).normalize();
        this.setLinearVelocity(dir.scale(speed));
        this.setAngularVelocity(rand(-12, 12));
        ballState = 'pitch';
        pitchOutcomeLocked = false;
        zoneEntered = false;
    }

    beginContact(other)
    {
        if (ballState !== 'play') return;
        if (other === backstopObj)
            sfxCatcher.play(this.pos);
    }

    render()
    {
        // soft shadow
        drawTile(this.pos.add(vec2(.08, -.08)), vec2(ballRadius*2.1), icons.circle, hsl(0,0,0,.25));
        // ball
        drawTile(this.pos, vec2(ballRadius*2), icons.circle, this.color);
        // stitching (rotates with body)
        const a = this.angle;
        const r = ballRadius*.7;
        drawLine(this.pos.add(vec2().setAngle(a, r)),
                 this.pos.add(vec2().setAngle(a+PI, r)),
                 .06, hsl(0, .55, .45));
        drawLine(this.pos.add(vec2().setAngle(a+PI/2, r)),
                 this.pos.add(vec2().setAngle(a-PI/2, r)),
                 .06, hsl(0, .55, .45));
    }
}

///////////////////////////////////////////////////////////////////////////////
// Bat

// Right-handed swing: bat pivots at the hand and sweeps CCW from idle (pointing
// back/south behind batter) through east (over the plate) to north-west
// follow-through. LittleJS angle convention: 0=+Y(N), +π/2=+X(E), π=-Y(S).
const batIdleAngle = 2.6;            // ~149° — bat tip rests south-east-ish behind batter
const batSwingArc  = -3.0;           // sweep ~172° CCW (decreasing angle)

function getBatInfo()
{
    const swingT = swingTimer.active() ? swingTimer.getPercent() : 0;
    const eased = smoothstep01(swingT);
    const angle = batIdleAngle + (swingTimer.active() ? batSwingArc * eased : 0);

    const hand = batterPos.add(vec2(.4, .3));
    const dir = vec2().setAngle(angle, batLength);

    return {a: hand, b: hand.add(dir), angle, swingT};
}

function trySwing()
{
    if (swingTimer.active()) return;
    if (ballState === 'play') return;
    swingConnected = false;
    swingTimer.set(swingDuration);
    if (ballState === 'pitch') swungAtPitch = true;
    sfxSwing.play(batterPos);
}

function checkBatContact()
{
    if (ballState !== 'pitch') return;
    if (!swingTimer.active() || swingConnected) return;

    const t = swingTimer.getPercent();
    if (t < .15 || t > .8) return;

    const {a, b} = getBatInfo();
    const d = distPointToSegment(ball.pos, a, b);
    const contactDist = ballRadius + batThickness;
    if (d <= contactDist)
    {
        swingConnected = true;

        // contact quality: sweet-spot position along bat + how centered on segment
        const ab = b.subtract(a);
        const along = clamp(ball.pos.subtract(a).dot(ab) / ab.lengthSquared(), 0, 1);
        const sweet  = 1 - clamp(abs(along - .8) / .5, 0, 1); // sweet spot near tip
        const center = 1 - clamp(d / contactDist, 0, 1);
        const quality = clamp(sweet*.65 + center*.35, 0, 1);

        registerHit(quality);
    }
}

///////////////////////////////////////////////////////////////////////////////
// Game logic

function startPitch()
{
    if (ballState !== 'idle') return;
    pitchNumber++;
    ball.pitch();
    sfxPitch.play(pitcherPos);
}

function endPitch()
{
    pitchOutcomeLocked = true;
    ball.parkAtMound();
    autoPitchTimer.set(rand(1, 4));
}

function registerStrike(text)
{
    if (pitchOutcomeLocked) return;
    strikes++;
    lastResultText = text;
    resultColor = hsl(0, .8, .7);
    resultTimer.set(1.3);
    sfxStrike.play(platePos);
    endPitch();

    if (strikes >= 3)
    {
        lastResultText = '3 STRIKES — OUT!';
        resultColor = hsl(0, 1, .65);
        resultTimer.set(1.8);
        balls = strikes = 0;
        autoPitchTimer.set(1.8);
    }
}

function registerBall(text)
{
    if (pitchOutcomeLocked) return;
    balls++;
    lastResultText = text;
    resultColor = hsl(.6, .6, .8);
    resultTimer.set(1.3);
    sfxBall.play(platePos);
    endPitch();

    if (balls >= 4)
    {
        lastResultText = 'BALL FOUR — WALK!';
        resultColor = hsl(.55, .9, .75);
        resultTimer.set(1.8);
        balls = strikes = 0;
        autoPitchTimer.set(1.8);
    }
}

function registerHit(quality)
{
    hits++;
    if (quality > .9) perfectHits++;
    balls = strikes = 0; // a hit resets the count

    // launch direction: perpendicular to the bat axis, 90° CCW
    // (matches the direction the bat is sweeping for our CCW swing)
    const {a, b} = getBatInfo();
    const batAxis = b.subtract(a).normalize();
    const launchDir = vec2(-batAxis.y, batAxis.x);

    const speed = lerp(22, 60, quality);
    ball.setLinearVelocity(launchDir.scale(speed));
    ball.setAngularVelocity(rand(-18, 18));
    ballState = 'play';
    pitchOutcomeLocked = true;

    // contact puffs at ball
    puffBurst(ball.pos, 18, 4, .375, .6, hsl(.1, .3, .85), hsl(.1, .3, .85));

    const label = quality > .9 ? 'PERFECT!' : quality > .65 ? 'Solid hit!' : 'Contact!';
    lastResultText = `${label} (${(quality*100|0)}%)`;
    resultColor = quality > .9 ? hsl(.14, 1, .65) : hsl(.55, .7, .8);
    resultTimer.set(1.6);

    sfxHit.play(ball.pos);
    if (quality > .8) sfxCrack.play(ball.pos);
}

function endPlay()
{
    if (ballState !== 'play') return;
    const dist = ball.pos.length();
    if (!resultTimer.active())
    {
        lastResultText = `In play: ${dist.toFixed(1)}m`;
        resultColor = hsl(.55, .5, .85);
        resultTimer.set(1.4);
    }
    ball.parkAtMound();
    autoPitchTimer.set(.9);
}

function resetSession()
{
    pitchNumber = balls = strikes = hits = perfectHits = homeRuns = 0;
    bestDistance = 0;
    lastResultText = '';
    resultTimer.unset();
    swingTimer.unset();
    swingConnected = false;
    ball.parkAtMound();
    autoPitchTimer.set(.6);
}

///////////////////////////////////////////////////////////////////////////////
// Menus

function startGame()
{
    resetSession();
    setPlaying(true);
    clearSubmenuStack();
    hideAllMenus();
}

function buildMenus()
{
    if (typeof createMenu !== 'function') return;

    // Only pause when a game is actually running. Title menu sits over
    // the canvas without freezing anything.
    installAutoPause();

    setMenuTheme({accent:'#ff6600', font:'Impact, "Arial Black", sans-serif'});
    createTitleMenu({
        title: 'HOME RUN DERBY',
        titleFx: {fill:'fire', color:'#f60', motion:'float'},
        subtitle: '',
        onPlay: startGame,
        revealOnClick: false,
        items: [
            {type: 'button', label: 'HELP', onClick: () => pushMenu('help')},
        ],
    });

    createHelpMenu({
        title: 'HELP',
        text: 'Time your swing to connect with each pitch and launch as many home runs as you can. Swing early or late and you\'ll miss — hit the sweet spot for a perfect blast.',
        extraItems: [
            {type: 'text', text: 'Space / Click swing · Enter next pitch'},
        ],
    });

    createPauseMenu({
        onRestart: startGame,
        onQuit:    quitToTitle,
    });

    installDefaultToolbar({landscapeStack:true});
}

///////////////////////////////////////////////////////////////////////////////
// Engine hooks

async function gameInit()
{
    await box2dInit();
    icons = initDefaultAtlas();

    cameraScale = 8;
    cameraPos = vec2(0, 19);
    gravity = vec2(0, 0); // top-down
    canvasClearColor = hsl(.25, .35, .22); // foul territory / dark green

    // backstop south of the catcher (catches missed pitches)
    backstopObj = new Box2dStaticObject(vec2(0, backstopY));
    backstopObj.addBox(vec2(8, .6), vec2(), 0, 0, .3, .1);
    backstopObj.render = ()=>{};

    ball = new Ball();
    autoPitchTimer.set(.8);

    buildMenus();
    showMenu('title');
}

function gameUpdate()
{
    if (bindPauseKey({when: () => isPlaying()})) return;
    if (!isPlaying()) return;

    // gamepad: A button (0) swings, alongside Space / click / touch tap
    if (keyWasPressed('Space') || mouseWasPressed(0) || gamepadWasPressed(0)) trySwing();
    if (keyWasPressed('Enter')) startPitch();
    if (keyWasPressed('KeyR')) resetSession();

    if (ballState === 'pitch')
    {
        // tracking: did the pitch pass through the strike zone?
        if (!zoneEntered && inStrikeZone(ball.pos))
            zoneEntered = true;

        // pitch ends when the ball crosses south of the plate
        if (ball.pos.y < platePos.y - zoneHalf.y - .25)
        {
            if (swungAtPitch)    registerStrike('Swinging Strike!');
            else if (zoneEntered) registerStrike('STRIKE!');
            else                  registerBall('BALL');
        }
    }
    else if (ballState === 'play')
    {
        const dist = ball.pos.length();
        const fair = inFairTerritory(ball.pos);

        if (dist > fenceRadius)
        {
            if (fair)
            {
                homeRuns++;
                if (dist > bestDistance) bestDistance = dist;
                lastResultText = 'HOME RUN!';
                resultColor = hsl(.13, 1, .65);
                resultTimer.set(2.2);
                sfxHomerun.play(ball.pos);
                puffBurst(ball.pos, 40, 7, .8, .9, hsl(.08, .9, .7), hsl(.18, .9, .7));
            }
            else
            {
                if (dist > bestDistance) bestDistance = dist;
                lastResultText = `Foul ball — ${dist.toFixed(1)}m`;
                resultColor = hsl(.0, .6, .75);
                resultTimer.set(1.6);
            }
            ball.parkAtMound();
            autoPitchTimer.set(1.2);
        }
        else
        {
            // ball has stopped rolling
            const v = ball.body.GetLinearVelocity();
            const speed2 = v.get_x()*v.get_x() + v.get_y()*v.get_y();
            if (speed2 < .25) endPlay();
        }
    }

    checkBatContact();

    if (autoPitchTimer.elapsed())
    {
        autoPitchTimer.unset();
        startPitch();
    }
}

function gameUpdatePost()
{
    // camera stays stationary — set once in gameInit, never panned
}

///////////////////////////////////////////////////////////////////////////////
// Rendering

// fair-territory wedge spans 45°..135° (foul lines)
const fairA0 = PI/2 - foulAngleHalf;
const fairA1 = PI/2 + foulAngleHalf;

// base positions form a true square (home & 2B are opposite corners)
const baseDist   = 20;                          // home -> 1B distance
const firstBase  = vec2(cos(PI/4)*baseDist, sin(PI/4)*baseDist);
const thirdBase  = vec2(cos(3*PI/4)*baseDist, sin(3*PI/4)*baseDist);
const secondBase = vec2(0, baseDist*Math.SQRT2);
const infieldCenter = vec2(0, baseDist*Math.SQRT2/2);

// --- arc / ring point-list builders (used for gap-free drawLineList outlines) ---
function arcPoints(r, a0, a1, segs)
{
    const pts = [];
    for (let i = 0; i <= segs; i++)
    {
        const t = a0 + (a1 - a0) * i / segs;
        pts.push(vec2(cos(t)*r, sin(t)*r));
    }
    return pts;
}

// filled annular wedge: outer arc forward, inner arc back
function ringPoly(rInner, rOuter, a0, a1, segs)
{
    return arcPoints(rOuter, a0, a1, segs).concat(arcPoints(rInner, a1, a0, segs));
}

function drawStadium()
{
    // The bowl is built from full concentric circles centered on home plate, then
    // the inner disc and the southern half are masked back to foul-territory color
    // so the rings read as a stadium wrapping the outfield. Drawn outermost first.
    const center   = platePos;
    const concrete = hsl(.62, .05, .44);
    const seatA    = hsl(.58, .16, .56);
    const seatB    = hsl(.60, .32, .36);

    // outer concrete bowl
    drawTile(center, vec2(180), icons.circle, concrete);

    // seat tiers: each smaller disc leaves a ring of the previous color
    let r = 80;
    for (let i = 0; i < 9; i++)
    {
        drawTile(center, vec2(r*2), icons.circle, i % 2 ? seatB : seatA);
        r -= 4.2;
    }

    // bright front railing ring at the lip of the bowl
    drawTile(center, vec2(46*2), icons.circle, hsl(0, 0, .82));

    // mask: re-open the interior (r<45) to foul-territory color, leaving the
    // seating as a ring; then cut the southern half so it sits behind the outfield
    drawTile(center, vec2(45*2), icons.circle, canvasClearColor);

    drawRect(center.add(vec2(0,-120)), vec2(2e3, 200), canvasClearColor,.5);
    drawRect(center.add(vec2(0,-120)), vec2(2e3, 200), canvasClearColor,-.5);
}

function drawFieldGround()
{
    const segs = 48;

    // fair grass: home plate apex out to the fence arc
    drawPoly([platePos, ...arcPoints(fenceRadius, fairA0, fairA1, segs)], hsl(.33, .5, .30));

    // classic mowed concentric arcs (alternating shade)
    for (const i of [1, 3, 5])
        drawPoly(ringPoly(i*7, (i+1)*7, fairA0, fairA1, segs), hsl(.33, .52, .35));

    // skinned infield (dirt diamond) with a grass center, aligned to the bases
    const dirt = hsl(.08, .45, .38);
    drawRect(infieldCenter, vec2(25, 25), dirt, PI/4);
    drawRect(infieldCenter, vec2(17, 17), hsl(.34, .5, .33), PI/4);

    // dirt cutouts at home and the mound
    drawTile(platePos.add(vec2(0, .3)), vec2(5), icons.circle, dirt);
    drawTile(moundCenter, vec2(4), icons.circle, hsl(.08, .38, .42));

    // warning track — single connected outline, no gaps
    drawLineList(arcPoints(fenceRadius - 1.6, fairA0, fairA1, segs), 1.8, hsl(.08, .4, .4));

    // outfield wall + yellow home-run line on top (both gap-free line lists)
    drawLineList(arcPoints(fenceRadius, fairA0, fairA1, segs), 1.3, hsl(.55, .3, .26));
    drawLineList(arcPoints(fenceRadius + .35, fairA0, fairA1, segs), .25, hsl(.14, .9, .6));
}

function drawDiamond()
{
    // foul lines from home to the fence
    drawLine(platePos, vec2(cos(fairA1), sin(fairA1)).scale(fenceRadius), .18, WHITE);
    drawLine(platePos, vec2(cos(fairA0), sin(fairA0)).scale(fenceRadius), .18, WHITE);

    // chalk baselines connecting the whole diamond (home -> 1B -> 2B -> 3B -> home)
    drawLineList([platePos, firstBase, secondBase, thirdBase], .25, hsl(0, 0, .95), true);

    // bases
    const baseSize = vec2(1.2, 1.2);
    drawRect(firstBase, baseSize, WHITE, PI/4);
    drawRect(secondBase, baseSize, WHITE, PI/4);
    drawRect(thirdBase, baseSize, WHITE, PI/4);

    // pitcher's rubber
    drawRect(moundCenter, vec2(1.2, .35), WHITE);

    // home plate (square + point toward catcher)
    drawRect(platePos, vec2(1.2, 1.0), WHITE);
    drawRect(platePos.add(vec2(0, -.6)), vec2(1.0, .5), WHITE, PI/4);

    // strike zone overlay
    drawRect(platePos, zoneHalf.scale(2), hsl(.16, .9, .6, .18));
    const zoneRect = [
        platePos.add(vec2(-zoneHalf.x, -zoneHalf.y)),
        platePos.add(vec2( zoneHalf.x, -zoneHalf.y)),
        platePos.add(vec2( zoneHalf.x,  zoneHalf.y)),
        platePos.add(vec2(-zoneHalf.x,  zoneHalf.y))];
    drawLineList(zoneRect, .08, hsl(.16, 1, .65, .9), true);
}

function drawBatter()
{
    const skin   = hsl(.07, .5, .62);
    const jersey = hsl(.6, .45, .5);
    const pants  = hsl(0, 0, .85);
    const helmet = hsl(.6, .55, .28);
    const hand   = batterPos.add(vec2(.4, .3));

    // batter's box outline
    const bw = .9, bh = 1.3;
    const box = [
        batterPos.add(vec2(-bw, -bh)), batterPos.add(vec2(bw, -bh)),
        batterPos.add(vec2( bw,  bh)), batterPos.add(vec2(-bw,  bh))];
    drawPoly(box, hsl(0, 0, 1, .06), .1, hsl(0, 0, 1, .4));

    // shadow + stance
    drawTile(batterPos.add(vec2(.25, -.3)), vec2(2.2, 2.4), icons.circle, hsl(0, 0, 0, .22));
    drawTile(batterPos.add(vec2(-.55, -.55)), vec2(.55, 1.0), icons.circle, pants, .35);
    drawTile(batterPos.add(vec2( .45, -.7)),  vec2(.55, 1.0), icons.circle, pants, -.25);

    // torso
    drawTile(batterPos.add(vec2(-.05, .15)), vec2(1.7, 2.1), icons.circle, jersey, .1);

    // arms reaching to the grip
    drawLine(batterPos.add(vec2(-.3, .55)), hand, .42, jersey);
    drawLine(batterPos.add(vec2(.25, .6)),  hand, .36, jersey);
    drawTile(hand, vec2(.55), icons.circle, skin);

    // helmet (with brim toward the pitcher + a little shine)
    drawTile(batterPos.add(vec2(0, 1.05)), vec2(.95, .45), icons.circle, helmet);
    drawTile(batterPos.add(vec2(0, .55)), vec2(1.05), icons.circle, helmet);
    drawTile(batterPos.add(vec2(-.2, .75)), vec2(.35), icons.circle, hsl(.6, .5, .42));
}

function drawFielders()
{
    // catcher (south of plate, crouched, mitt up toward the plate)
    drawTile(catcherPos.add(vec2(.2, -.25)), vec2(2.5, 2.5), icons.circle, hsl(0, 0, 0, .22));
    drawTile(catcherPos, vec2(1.7), icons.circle, hsl(.05, .55, .42));
    drawTile(catcherPos.add(vec2(0, .4)), vec2(.9), icons.circle, hsl(.6, .4, .3));
    drawTile(catcherPos.add(vec2(.15, 1.0)), vec2(.6), icons.circle, hsl(.08, .5, .35));

    // pitcher on the mound
    drawTile(pitcherPos.add(vec2(.25, -.25)), vec2(2.1, 2.3), icons.circle, hsl(0, 0, 0, .22));
    drawTile(pitcherPos.add(vec2(0, -.1)), vec2(1.7, 2.0), icons.circle, hsl(0, .5, .42), -.08);
    drawTile(pitcherPos.add(vec2(0, .35)), vec2(.95), icons.circle, hsl(0, .4, .3));
    drawTile(pitcherPos.add(vec2(0, .35)), vec2(.55), icons.circle, hsl(.07, .5, .62));
}

function drawField()
{
    drawStadium();
    drawFieldGround();
    drawDiamond();
    drawBatter();
    drawFielders();
}

function drawBat()
{
    const {a, b, swingT} = getBatInfo();

    // bat barrel
    drawLine(a, b, batThickness*2, hsl(.08, .35, .42));
    // grain lines
    const dir = b.subtract(a).normalize();
    for (let i = 1; i < 4; i++)
    {
        const p = a.add(dir.scale(batLength * i/4));
        drawLine(p.subtract(dir.scale(.04)), p.add(dir.scale(.04)),
            batThickness*1.5, hsl(.08, .25, .28));
    }

    // grip wrap
    const gripDir = a.subtract(b).normalize(1);
    const gripEnd = a.add(gripDir.scale(.8));
    drawLine(a, gripEnd, batThickness*2.4, hsl(0, 0, .12));

    // swing-arc hint
    if (swingTimer.active())
        drawTile(a, vec2(1.0 + swingT*2.2), icons.circle, hsl(.55, .6, .8, .07));
}

// One-shot puff burst via the engine's ParticleEmitter (was a hand-rolled array).
// Atlas-circle particles that drag to a stop and shrink/fade out, no gravity.
// colA..colB is the start-color range (home runs vary their hue across it).
function puffBurst(pos, count, speed, life, sizeStart, colA, colB)
{
    new ParticleEmitter(
        pos, 0,                  // pos, angle
        0,                       // emitSize (point)
        count/600, 600,          // emitTime, emitRate -> ~count particles
        PI,                      // emitConeAngle (full radial)
        icons.circle,            // tileInfo (atlas circle)
        colA, colB,              // colorStartA/B (hue range)
        colA.scale(1, 0), colB.scale(1, 0), // colorEndA/B (fade alpha to 0)
        life,                    // particleTime
        sizeStart, .1,           // sizeStart, sizeEnd (was lerp(.1,.9,t/.6))
        speed/60,                // speed (per-frame; was per-sec)
        0, .96, 1,               // angleSpeed, damping (air drag), angleDamping
        0,                       // gravityScale (no gravity)
        0,                       // particleConeAngle
        .2,                      // fadeRate
        .4,                      // randomness
        false, false             // collideTiles, additive
    );
}

function gameRender()
{
    drawField();
    drawBat();
}

function gameRenderPost()
{
    const cx = mainCanvasSize.x/2;
    const line1 = `BATTING PRACTICE   •   Pitch ${pitchNumber}   •   ${balls}-${strikes}`;
    const line2 = `Hits ${hits}   •   Perfect ${perfectHits}   •   HR ${homeRuns}   •   Best ${bestDistance.toFixed(1)}m`;
    drawTextScreen(line1, vec2(cx, 40), 28, hsl(0,0,1), 4, hsl(0,0,0));
    drawTextScreen(line2, vec2(cx, 76), 22, hsl(0,0,1), 4, hsl(0,0,0));

    if (resultTimer.active() && lastResultText)
    {
        const t = clamp(resultTimer.getPercent(), 0, 1);
        const size = lerp(54, 38, t);
        drawTextScreen(lastResultText, vec2(cx, 140), size, resultColor, 6, hsl(0,0,0));
    }
}

///////////////////////////////////////////////////////////////////////////////
// Startup LittleJS Engine
engineInit(gameInit, gameUpdate, gameUpdatePost, gameRender, gameRenderPost);

</script>
