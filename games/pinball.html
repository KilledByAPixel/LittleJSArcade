<!DOCTYPE html><head>
<title>LittleJS Pinball</title>
<meta charset="utf-8">
</head>
<script src="../templates/engineLoader.js?1780767748506"></script>
<script src="../templates/textureGenerator.js?1780767748506"></script>
<script src="../templates/gameFx.js?1780767748506"></script>
<script src="../dist/box2d.wasm.js?1780767748506"></script>
<script src="../templates/menus.js?1780767748506"></script>
<script>
'use strict';

// engine settings
gravity = vec2(0, -30);
canvasFixedSize = vec2(1000, 1080);
cameraScale = 26;

// on-screen touch gamepad (analog stick + face buttons) for mobile
touchGamepadEnable = true;
touchGamepadAnalog = false;
touchGamepadLeftStick = false;
touchGamepadLeftButtonCount = 1;
touchGamepadButtonCount = 1;

///////////////////////////////////////////////////////////////////////////////
// Layout

const PLAY_W = 20;                       // symmetric playfield width
const PLAY_H = 40;                       // taller table
const WALL_T = 0.3;

// Vertical walls end where the dome begins
const WALL_TOP_Y = 25;

// Playfield spans x = -10 to +10 (symmetric around x=0)
const PLAY_HALF_W = PLAY_W / 2;          // 10

// Launch lane is a separate channel to the right of the playfield
const LANE_INNER_X = PLAY_HALF_W + WALL_T/2;     // 10.15 - playfield right wall center
const LANE_OUTER_X = PLAY_HALF_W + 2 + WALL_T/2; // 12.15 - lane outer wall center
const LANE_CENTER_X = (LANE_INNER_X + LANE_OUTER_X) / 2;  // 11.15
const LANE_FLOOR_Y = 0.9;

// Top arcs
// Rail (outer arc) is centered at (1, WALL_TOP_Y) so its right end lands on the outer lane
// wall (x=12) and its left end lands on the left playfield wall (x=-10).
// Dome (inner arc) shares the rail's center so the channel between them is uniform width
// (radial gap = RAIL_RADIUS - DOME_RADIUS = 2, enough for the 1-unit ball with clearance).
// Dome radius is 9 so its right end lines up with the right playfield wall (1 + 9 = 10).
const RAIL_CENTER = vec2(1, WALL_TOP_Y);
const DOME_CENTER = RAIL_CENTER;
const DOME_RADIUS = 9.1;                   // inner arc - the playfield ceiling
const RAIL_RADIUS = 11.1;                  // outer arc - the launcher top rail
const DOME_END_ANGLE = 2.0;              // inner arc stops before full semicircle (leaves left exit open)
const RAIL_END_ANGLE = PI;          // outer rail wraps the full top, all the way to the left wall

const BALL_DIAMETER = 1;
const BALL_SPAWN = vec2(LANE_CENTER_X, 2.3);

const FLIPPER_LENGTH = 3.2;
const FLIPPER_THICKNESS = 0.5;
const FLIPPER_REST_ANGLE = 0.35;
const FLIPPER_FLIP_ANGLE = 0.85;
const FLIPPER_MOTOR_SPEED = 45;
const FLIPPER_MOTOR_TORQUE = 20000;
const LEFT_PIVOT = vec2(-4.2, 3.4);
const RIGHT_PIVOT = vec2(4.2, 3.4);

const DRAIN_Y = -1.5;
const LAUNCH_MIN = 45;
const LAUNCH_MAX = 70;

const WALL_COLOR = hsl(0.55, 0.4, 0.7);
const RAIL_COLOR = hsl(0.55, 0.5, 0.6);
const SLING_COLOR = hsl(0, 0.8, 0.45);
const FLIPPER_COLOR = hsl(0.05, 0.9, 0.55);
const BALL_COLOR = hsl(0, 0, 0.9);

///////////////////////////////////////////////////////////////////////////////
// State

let ball = null;
let leftFlipper, rightFlipper;
let bumpers = [];
let slingshots = [];
let score = 0;
let ballsLeft = 3;
let gameOver = false;
let launchCharge = 0;
let hasLaunchedEver = false;
let sfxBumper, sfxFlipper, sfxDrain, sfxLaunch, sfxWall, sfxSling;
// rising-edge tracking so flipper sfx fires once when a flipper activates
let leftFlipperWasActive = false, rightFlipperWasActive = false;

///////////////////////////////////////////////////////////////////////////////
// Ball

class Ball extends Box2dObject
{
    constructor(pos)
    {
        super(pos, vec2(BALL_DIAMETER), undefined, 0, BALL_COLOR);
        this.addCircle(BALL_DIAMETER, vec2(), 1, 0.05, 0.25);
        this.setBullet(true);
        this.setLinearDamping(0.15);
    }
    beginContact(other)
    {
        const speed = this.getLinearVelocity().length();
        if (speed > 7 && !(other instanceof Bumper) && !(other instanceof Flipper) && !(other instanceof Slingshot))
            sfxWall && sfxWall.play(this.pos, 0.4, clamp(speed/20, 0.5, 2));
    }
    render()
    {
        drawTile(this.pos, vec2(BALL_DIAMETER + 0.08), icons.circle, BLACK);       // rim
        drawTile(this.pos, vec2(BALL_DIAMETER), icons.circle, BALL_COLOR);
        drawTile(this.pos.add(vec2(-0.15, 0.15)), vec2(0.3), icons.circle, hsl(0, 0, 1, 0.5));
    }
}

///////////////////////////////////////////////////////////////////////////////
// Bumper

class Bumper extends Box2dStaticObject
{
    constructor(pos, radius = 1)
    {
        super(pos, vec2(radius * 2));
        this.radius = radius;
        this.addCircle(radius * 2, vec2(), 0, 0.1, 1.2);
        this.flashTime = 0;
    }
    beginContact(other)
    {
        if (other === ball)
        {
            this.flashTime = 0.2;
            score += 100;
            sfxBumper && sfxBumper.play(this.pos);
            const dir = other.pos.subtract(this.pos).normalize();
            other.applyAcceleration(dir.scale(18));
        }
    }
    render()
    {
        const flash = this.flashTime > 0;
        const outer = flash ? WHITE : hsl(0.13, 0.9, 0.55);
        const inner = flash ? hsl(0.13, 1, 0.85) : hsl(0.13, 0.9, 0.35);
        drawTile(this.pos, vec2(this.radius * 2 + 0.15), icons.circle, BLACK);   // rim
        drawTile(this.pos, vec2(this.radius * 2), icons.circle, outer);
        drawTile(this.pos, vec2(this.radius * 1.1), icons.circle, inner);
        this.flashTime = max(0, this.flashTime - 1/60);
    }
}

///////////////////////////////////////////////////////////////////////////////
// Slingshot

class Slingshot extends Box2dStaticObject
{
    constructor(pos, size, angle, kickDir)
    {
        super(pos, size, undefined, angle);
        this.addBox(size, vec2(), 0, 0, 0.1, 0.4);
        this.color = SLING_COLOR;
        this.kickDir = kickDir;
        this.flashTime = 0;
    }
    beginContact(other)
    {
        if (other === ball)
        {
            this.flashTime = 0.12;
            score += 25;
            sfxSling && sfxSling.play(this.pos);
            other.applyAcceleration(this.kickDir.scale(10));
        }
    }
    render()
    {
        const color = this.flashTime > 0 ? WHITE : SLING_COLOR;
        drawRect(this.pos, this.size, color, this.angle);
        this.flashTime = max(0, this.flashTime - 1/60);
    }
}

///////////////////////////////////////////////////////////////////////////////
// Flipper

class Flipper extends Box2dObject
{
    constructor(pivotPos, facingRight)
    {
        const dir = facingRight ? 1 : -1;
        const centerPos = pivotPos.add(vec2(dir * FLIPPER_LENGTH / 2, 0));
        super(centerPos, vec2(FLIPPER_LENGTH, FLIPPER_THICKNESS), undefined, 0, FLIPPER_COLOR);
        this.pivotPos = pivotPos;
        this.facingRight = facingRight;
        this.addBox(vec2(FLIPPER_LENGTH, FLIPPER_THICKNESS), vec2(), 0, 3, 0.1, 0.05);
        this.setBullet(true);
        this.setAngularDamping(0.5);

        this.anchor = new Box2dStaticObject(pivotPos, vec2(0.2));
        this.joint = new Box2dRevoluteJoint(this.anchor, this, pivotPos);
        this.joint.enableLimit(true);
        if (facingRight)
            this.joint.setLimits(-FLIPPER_REST_ANGLE, FLIPPER_FLIP_ANGLE);
        else
            this.joint.setLimits(-FLIPPER_FLIP_ANGLE, FLIPPER_REST_ANGLE);
        this.joint.enableMotor(true);
        this.joint.setMaxMotorTorque(FLIPPER_MOTOR_TORQUE);
        this.setMotor(false);
    }
    setMotor(active)
    {
        const dir = this.facingRight ? 1 : -1;
        const speed = (active ? FLIPPER_MOTOR_SPEED : -FLIPPER_MOTOR_SPEED) * dir;
        this.joint.setMotorSpeed(speed);
    }
    render()
    {
        drawRect(this.pos, vec2(FLIPPER_LENGTH, FLIPPER_THICKNESS), FLIPPER_COLOR, this.angle);
        drawTile(this.pivotPos, vec2(FLIPPER_THICKNESS * 1.4), icons.circle, hsl(0, 0, 0.2));
    }
}

///////////////////////////////////////////////////////////////////////////////
// World build helpers

function addWall(pos, size, angle = 0, color = WALL_COLOR)
{
    const w = new Box2dStaticObject(pos, size, undefined, angle);
    w.addBox(size);
    w.color = color;
    return w;
}

function buildArc(center, radius, startA, endA, numSegs, thickness = 0.3, color = RAIL_COLOR)
{
    for (let i = 0; i < numSegs; i++)
    {
        const a1 = startA + (endA - startA) * (i / numSegs);
        const a2 = startA + (endA - startA) * ((i + 1) / numSegs);
        const p1 = vec2(center.x + radius * cos(a1), center.y + radius * sin(a1));
        const p2 = vec2(center.x + radius * cos(a2), center.y + radius * sin(a2));
        const mid = p1.add(p2).scale(0.5);
        const length = p1.distance(p2);
        const segAngle = atan2(p2.y - p1.y, p2.x - p1.x);
        addWall(mid, vec2(length + 0.08, thickness), -segAngle, color);
    }
}

function buildWorld()
{
    // Playfield side walls (up to where the dome takes over)
    addWall(vec2(-LANE_INNER_X, WALL_TOP_Y/2), vec2(WALL_T, WALL_TOP_Y));
    addWall(vec2(LANE_INNER_X, WALL_TOP_Y/2), vec2(WALL_T, WALL_TOP_Y));

    // Launch lane outer wall
    addWall(vec2(LANE_OUTER_X, WALL_TOP_Y/2), vec2(WALL_T, WALL_TOP_Y));

    // Lane floor
    const laneFloorW = LANE_OUTER_X - LANE_INNER_X + WALL_T;
    addWall(vec2(LANE_CENTER_X, LANE_FLOOR_Y), vec2(laneFloorW, 0.3));

    // Playfield dome (inner arc): ceiling of the main playfield, stops short on the left for exit
    buildArc(DOME_CENTER, DOME_RADIUS, 0, DOME_END_ANGLE, 14);

    // Launcher top rail (outer arc): curved channel over the dome that guides the launched ball
    buildArc(RAIL_CENTER, RAIL_RADIUS, 0, RAIL_END_ANGLE, 24);

    // Slingshots above flippers (symmetric, near flipper pivots)
    slingshots.push(new Slingshot(vec2(-6.25, 5.5), vec2(4.0, 0.6), 0.686, vec2(0.633, 0.774)));
    slingshots.push(new Slingshot(vec2(6.25, 5.5), vec2(4.0, 0.6), -0.686, vec2(-0.633, 0.774)));

    // Mid-height wedges: deflect balls coming down the side walls back toward center.
    // Left wedge "\" - upper-left end touches the wall, lower-right end juts into the playfield.
    // Right wedge "/" mirrors it so the playfield reads symmetric.
    addWall(vec2(-8.2, 10.5), vec2(4.0, 0.5),  0.5, RAIL_COLOR);
    addWall(vec2( 8.2, 10.5), vec2(4.0, 0.5), -0.5, RAIL_COLOR);

    // Bumpers (upper triangle, symmetric about x=0)
    bumpers.push(new Bumper(vec2(-3.5, 17), 1.3));
    bumpers.push(new Bumper(vec2( 3.5, 17), 1.3));
    bumpers.push(new Bumper(vec2(   0, 21), 1.3));

    // Flippers
    leftFlipper = new Flipper(LEFT_PIVOT, true);
    rightFlipper = new Flipper(RIGHT_PIVOT, false);
}

///////////////////////////////////////////////////////////////////////////////
// Launch

function canLaunch()
{
    if (!ball) return false;
    // Ball is in the lane (right of playfield wall) near the floor and slow
    return ball.pos.x > LANE_INNER_X + WALL_T/2
        && ball.pos.y < 5
        && ball.getLinearVelocity().length() < 3;
}

function launchBall(power)
{
    if (!ball) return;
    ball.setLinearVelocity(vec2(0, power));
    hasLaunchedEver = true;
    sfxLaunch && sfxLaunch.play(ball.pos);
}

function spawnBall()
{
    if (ball) { ball.destroy(); ball = null; }
    ball = new Ball(BALL_SPAWN);
    launchCharge = 0;
}

function loseBall()
{
    sfxDrain && sfxDrain.play();
    ballsLeft--;
    if (ballsLeft <= 0)
    {
        gameOver = true;
        submitBestScore(score);
    }
    else
    {
        spawnBall();
    }
}

function resetGame()
{
    score = 0;
    ballsLeft = 3;
    gameOver = false;
    hasLaunchedEver = false;
    spawnBall();
}

///////////////////////////////////////////////////////////////////////////////

let icons;   // default-atlas icon map (name -> TileInfo), tinted per draw

async function gameInit()
{
    saveDataInit('pinball');
    cameraPos = vec2(0, PLAY_H/2);

    await box2dInit();
    icons = initDefaultAtlas();

    sfxBumper = new SoundGenerator({ frequency: 440, release: 0.08, volume: 0.4, pitchJump: 200, pitchJumpTime: 0.02 });
    sfxSling = new SoundGenerator({ frequency: 320, release: 0.06, volume: 0.35, pitchJump: 120, pitchJumpTime: 0.02 });
    sfxFlipper = new SoundGenerator({ frequency: 180, release: 0.05, volume: 0.3, noise: 0.3 });
    sfxDrain = new SoundGenerator({ frequency: 120, release: 0.4, volume: 0.5, slide: -0.2 });
    sfxLaunch = new SoundGenerator({ frequency: 90, release: 0.3, volume: 0.5, slide: 0.3 });
    sfxWall = new SoundGenerator({ frequency: 300, release: 0.04, volume: 0.2, noise: 0.2 });

    buildWorld();
    resetGame();

    buildMenus();
    showMenu('title');
}

function startGame()
{
    resetGame();
    setPlaying(true);
    clearSubmenuStack();
    hideAllMenus();
}

function buildMenus()
{
    if (typeof createMenu !== 'function') return;

    installAutoPause();

    setMenuTheme({accent:'#ff00aa', borderWidth:3, font:'Impact, "Arial Black", sans-serif'});
    createTitleMenu({
        title: 'PINBALL',
        titleFx: {fill:'neon', color:'#f0a', sparkle:true},
        subtitle: '',
        onPlay: startGame,
        revealOnClick: false,
        items: [
            {type:'button', label:'HELP', onClick: () => pushMenu('help')},
        ],
    });

    createHelpMenu({
        title: 'HELP',
        text: 'Hit bumpers, slingshots, and targets to rack up points. You have 3 balls — keep them out of the drain. Hold to charge the plunger, then release to launch.',
        extraItems: [
            {type:'text', text:'Left Arrow / Z · Left flipper   Right Arrow / / · Right flipper'},
        ],
    });

    createPauseMenu({
        onRestart: startGame,
        onQuit:    quitToTitle,
    });

    installDefaultToolbar({landscapeStack:true});
}

function gameUpdate()
{
    if (bindPauseKey({when: () => isPlaying() && !gameOver})) return;
    if (!isPlaying()) return;

    if (gameOver)
    {
        // gamepad: A restarts on the game-over screen
        if (keyWasPressed('Space') || keyWasPressed('Enter') || gamepadWasPressed(0))
            resetGame();
        return;
    }

    // The launch lane doubles as a sensor: while canLaunch() is true the ball is
    // sitting in the lane, so ANY press charges the plunger and no flipper fires.
    const launching = canLaunch();

    // Flippers run off two buttons, which the engine fills from BOTH the on-screen
    // touch gamepad and a physical controller (merged into the same gamepadIsDown API):
    //   button 4 = left  flipper (touch left button / LB / Dpad-Left)
    //   button 0 = right flipper (touch right button / A / RB / Dpad-Right)
    const padLeftDown  = gamepadIsDown(4) || gamepadIsDown(14);
    const padRightDown = gamepadIsDown(0) || gamepadIsDown(5) || gamepadIsDown(15);

    let leftActive = false, rightActive = false;
    if (!launching)
    {
        leftActive  = padLeftDown;
        rightActive = padRightDown;
        if (!isTouchDevice)
        {
            // keyboard + mouse flippers (desktop only)
            const dir = keyDirection();
            leftActive  = leftActive  || dir.x < 0 || keyIsDown('KeyZ')  || mouseIsDown(0);
            rightActive = rightActive || dir.x > 0 || keyIsDown('Slash') || mouseIsDown(2);
        }
    }

    // While armed in the lane, EITHER flipper button (or Space / mouse) charges the plunger.
    let anyPress = padLeftDown || padRightDown || keyIsDown('Space');
    if (!isTouchDevice)
        anyPress = anyPress || mouseIsDown(0) || mouseIsDown(2);

    // play the flip sfx once on the rising edge of each flipper activating
    if (leftActive  && !leftFlipperWasActive)  sfxFlipper && sfxFlipper.play(leftFlipper.pos, 0.5);
    if (rightActive && !rightFlipperWasActive) sfxFlipper && sfxFlipper.play(rightFlipper.pos, 0.5);
    leftFlipperWasActive  = leftActive;
    rightFlipperWasActive = rightActive;

    leftFlipper.setMotor(leftActive);
    rightFlipper.setMotor(rightActive);

    if (launching)
    {
        // hold any press to charge the plunger, release to launch with that power
        if (anyPress)
            launchCharge = min(LAUNCH_MAX, launchCharge + 1.2);
        else if (launchCharge > 0)
        {
            launchBall(max(LAUNCH_MIN, launchCharge));
            launchCharge = 0;
        }
    }
    else
    {
        launchCharge = 0;
    }

    if (ball && ball.pos.y < DRAIN_Y) loseBall();
}

function gameUpdatePost()
{
    cameraPos = vec2(0, PLAY_H/2);
}

function gameRender()
{
    // Playfield rectangle (below the dome)
    drawRectGradient(vec2(0, WALL_TOP_Y/2), vec2(PLAY_W, WALL_TOP_Y),
                     hsl(0.62, 0.6, 0.15), hsl(0.7, 0.5, 0.05));
    // Dome interior fill
    drawTile(DOME_CENTER, vec2(DOME_RADIUS * 2), icons.circle, hsl(0.62, 0.6, 0.18));

    // Lane tint (narrow strip on the right, outside playfield).
    // This strip is the launch sensor: brighten it while the ball is armed to fire.
    const laneH = WALL_TOP_Y - LANE_FLOOR_Y;
    drawRect(vec2(LANE_CENTER_X, (WALL_TOP_Y + LANE_FLOOR_Y)/2),
             vec2(LANE_OUTER_X - LANE_INNER_X, laneH),
             canLaunch() ? hsl(0.33, 0.5, 0.22) : hsl(0.7, 0.3, 0.12));

    // Launcher gauge inside the lane
    if (canLaunch())
    {
        const frac = launchCharge / LAUNCH_MAX;
        drawRect(vec2(LANE_CENTER_X, 6), vec2(0.35, 8), hsl(0, 0, 0.15));
        if (frac > 0)
            drawRect(vec2(LANE_CENTER_X, 2 + frac * 4), vec2(0.35, frac * 8), hsl(0.33 - frac * 0.33, 1, 0.5));
    }
}

function gameRenderPost()
{
    drawTextScreen('SCORE: ' + score, vec2(mainCanvasSize.x/2, 40), 30, WHITE, 4, BLACK);
    drawTextScreen('BALLS: ' + ballsLeft, vec2(80, 40), 22, WHITE, 3, BLACK);
    const hi = getBestScore();
    if (hi)
        drawTextScreen('HI: ' + hi, vec2(mainCanvasSize.x - 100, 40), 22, hsl(0.15, 1, 0.7), 3, BLACK);

    if (gameOver)
    {
        drawTextScreen('GAME OVER', vec2(mainCanvasSize.x/2, mainCanvasSize.y/2 - 40), 60, hsl(0, 0.9, 0.6), 5, BLACK);
        drawTextScreen('Press SPACE to restart', vec2(mainCanvasSize.x/2, mainCanvasSize.y/2 + 20), 24, WHITE, 3, BLACK);
    }
    else if (canLaunch())
    {
        const verb = hasLaunchedEver ? 'relaunch' : 'launch';
        const msg = isTouchDevice ? 'Hold a flipper button to charge, release to ' + verb
                                  : 'Hold to charge, release to ' + verb;
        drawTextScreen(msg, vec2(mainCanvasSize.x/2, mainCanvasSize.y - 60), 22, WHITE, 3, BLACK);
    }
}

engineInit(gameInit, gameUpdate, gameUpdatePost, gameRender, gameRenderPost);

</script>
</body></html>
