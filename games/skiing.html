<!DOCTYPE html><head>
<title>LittleJS Skiing</title>
<meta charset="utf-8">
</head>
<script src="../templates/engineLoader.js?1780767748506"></script>
<script src="../templates/textureGenerator.js?1780767748506"></script>
<script src="../templates/gameFx.js?1780767748506"></script>
<script src="../templates/menus.js?1780767748506"></script>
<script>
'use strict';

// engine settings
canvasFixedSize = vec2(1080, 1080);
cameraScale = 38;

///////////////////////////////////////////////////////////////////////////////
// Game Constants

const PLAYER_SIZE = vec2(.8, 1.2);

const MAX_SPEED = 80;        // maximum speed (4x faster)
const ACCELERATION = 40;     // how fast you accelerate
const FRICTION = 0.98;       // friction multiplier
const TURN_SPEED = 4;        // how fast player rotates toward mouse

const JUMP_POWER = 12;       // jump velocity
const GRAVITY = -25;         // gravity when in air
const AIR_TIME = .6;         // how long jumps last

const OBSTACLE_SPAWN_RADIUS = 35; // spawn obstacles this far ahead

///////////////////////////////////////////////////////////////////////////////
// Game State

let player;
let score = 0;
let distance = 0;
let gameTime = 0;
let gameState = 'playing'; // 'playing', 'crashed'
let gameStarted = false;

let obstacles = [];  // {pos, size, type: 'tree'|'rock'|'bump'|'ramp'}
let snowEmitter;     // persistent snow-spray trail (ParticleEmitter)

// sounds
let sfxWoosh, sfxCrash, sfxStart;

///////////////////////////////////////////////////////////////////////////////
// Player

class Player
{
    constructor()
    {
        this.pos = vec2(0, 0);
        this.vel = vec2(0, 0);
        this.angle = 0;
        this.targetAngle = 0;
        this.crashed = false;
        this.isJumping = false;
        this.jumpTimer = 0;
        this.jumpZ = 0;  // height off ground
        this.jumpVelZ = 0;
    }

    update()
    {
        if (this.crashed) return;

        // Steer with the most recently used device. Mouse aims toward the cursor
        // only while it's active; gamepad carves with the left stick; when the
        // stick is idle the last carve angle is held (no snap back to the mouse).
        const stick = gamepadStick(0);
        if (usingMouseInput())
            this.targetAngle = this.pos.subtract(mousePos).angle();
        else if (abs(stick.x) > .2)
            this.targetAngle = stick.x * (PI/2); // full left/right = max carve angle

        this.targetAngle = clamp(this.targetAngle, -PI/2, PI/2); // limit to downward angles only
        
        // smoothly rotate toward target angle
        let angleDiff = this.targetAngle - this.angle;
        
        this.angle += angleDiff * TURN_SPEED * timeDelta;

        if (!this.isJumping)
        {
            // move in the direction you're facing
            const moveDir = vec2(0,1).rotate(this.angle);
            
            // speed based on how much you're pointing downward
            // sin(-PI/2) = -1 (straight down), sin(0) = 0 (right), sin(-PI) = 0 (left)
            const downComponent = cos(this.angle);
            
            if (downComponent > 0.1) // pointing at least somewhat down
            {
                // accelerate when pointing down
                const accel = -downComponent * ACCELERATION * timeDelta;
                this.vel = this.vel.add(moveDir.scale(accel));
            }
            else
            {
                // slow down when horizontal
                this.vel = this.vel.scale(0.92);
            }

            // apply friction
            this.vel = this.vel.scale(FRICTION);

            // clamp speed
            const speed = this.vel.length();
            if (speed > MAX_SPEED)
                this.vel = this.vel.normalize(MAX_SPEED);
            
            // update position
            this.pos = this.pos.add(this.vel.scale(timeDelta));

            // jump on click or gamepad A
            if (mouseWasPressed(0) || gamepadWasPressed(0))
                this.jump();
        }
        else
        {
            // in air - no control, just move forward
            this.pos = this.pos.add(this.vel.scale(timeDelta));
            
            // update jump physics
            this.jumpVelZ += GRAVITY * timeDelta;
            this.jumpZ += this.jumpVelZ * timeDelta;
            
            if (this.jumpZ <= 0)
            {
                this.jumpZ = 0;
                this.jumpVelZ = 0;
                this.isJumping = false;
            }
        }

        // snow spray — drive the persistent trail emitter behind the skier
        if (!this.isJumping && this.vel.length() > 2)
        {
            // behind the skier = opposite of travel = +moveDir (movement is -moveDir).
            // The old vec2(cos(angle+PI),sin(angle+PI)) was standard-convention cos/sin
            // on a .rotate()/.angle()-convention this.angle, so it sprayed ~sideways.
            const backDir = vec2(0, 1).rotate(this.angle);
            snowEmitter.pos = this.pos.add(backDir.scale(.4));
            snowEmitter.angle = this.angle;          // emit up-behind, along backDir
            snowEmitter.emitRate = 50;
        }
        else
            snowEmitter.emitRate = 0;
    }

    jump()
    {
        if (this.isJumping) return;
        
        this.isJumping = true;
        this.jumpZ = 0.1;
        this.jumpVelZ = JUMP_POWER;
        sfxWoosh && sfxWoosh.play(this.pos);
    }

    hitRamp()
    {
        if (this.isJumping) return;
        
        this.isJumping = true;
        this.jumpZ = 0.1;
        this.jumpVelZ = JUMP_POWER * 1.8; // bigger jump from ramp
        sfxWoosh && sfxWoosh.play(this.pos);
    }

    crash()
    {
        if (this.crashed) return;
        this.crashed = true;
        gameState = 'crashed';
        submitBestScore(floor(distance));
        sfxCrash && sfxCrash.play(this.pos);

        // crash particles — one-shot radial burst of icy spray
        new ParticleEmitter(
            this.pos, 0,         // pos, angle
            0,                   // emitSize (point)
            30/600, 600,         // emitTime, emitRate -> 30
            PI,                  // emitConeAngle (radial)
            icons.circle,        // tileInfo (atlas circle)
            hsl(.6,.8,.6), hsl(.6,.8,.6),       // cyan
            hsl(.6,.8,.6,0), hsl(.6,.8,.6,0),   // fade to transparent
            1.2,                 // particleTime (was rand .5-1.2)
            .3, .3,              // sizeStart, sizeEnd (was rand .2-.4)
            8/60,                // speed (per-frame; was per-sec rand 4-12)
            0, .95, 1,           // angleSpeed, damping, angleDamping
            1,                   // gravityScale (global gravity = -8/sec^2)
            0, .15, .45,         // particleConeAngle, fadeRate, randomness
            false, false         // collideTiles, additive
        );
        snowEmitter.emitRate = 0;  // stop the trail on crash
    }

    render()
    {
        const color = this.crashed ? hsl(0, .7, .5) : hsl(.6, .6, .5);
        
        // shadow when jumping
        if (this.jumpZ > 0)
        {
            const shadowScale = 1 + this.jumpZ * .15;
            drawTile(this.pos, vec2(.6 * shadowScale), icons.circle, hsl(0, 0, 0, .3 / shadowScale));
        }
        
        // offset position based on jump height
        const renderPos = this.pos.add(vec2(0, this.jumpZ * .5));
        
        // skier body
        drawRect(renderPos, vec2(0.5, .5), color, this.angle);
        
        // skis
        const skiLength = 1.4;
        const skiWidth = .15;
        const skiOffset = .3;
        
        // left ski
        drawRect(
            renderPos.add(vec2(-skiOffset, 0).rotate(this.angle)),
            vec2(skiWidth, skiLength),
            hsl(0, 1, .6),
            this.angle
        );
        
        // right ski
        drawRect(
            renderPos.add(vec2(skiOffset, 0).rotate(this.angle)),
            vec2(skiWidth, skiLength),
            hsl(0, 1, .6),
            this.angle
        );

        // goggles/face
        drawTile(
            renderPos.add(vec2(0, .3).rotate(this.angle)),
            vec2(.5),
            icons.circle,
            hsl(.1, .9, .6)
        );
    }
}

///////////////////////////////////////////////////////////////////////////////
// Obstacles

function spawnObstacleAt(pos, type)
{
    if (type === 'tree')
    {
        obstacles.push({
            pos: pos.copy(),
            size: vec2(1.2, 1.8),
            type: 'tree'
        });
    }
    else if (type === 'rock')
    {
        obstacles.push({
            pos: pos.copy(),
            size: vec2(1, .8),
            type: 'rock'
        });
    }
    else if (type === 'bump')
    {
        obstacles.push({
            pos: pos.copy(),
            size: vec2(1.5, .6),
            type: 'bump'
        });
    }
    else if (type === 'ramp')
    {
        obstacles.push({
            pos: pos.copy(),
            size: vec2(2, 1),
            type: 'ramp'
        });
    }
}

function spawnObstaclesAround(centerPos)
{
    // spawn obstacles in a radius around the center position
    const spawnDist = OBSTACLE_SPAWN_RADIUS;
    
    // check if we need obstacles in this area
    const gridSize = 8;
    const gridX = (centerPos.x / gridSize) | 0;
    const gridY = (centerPos.y / gridSize) | 0;
    
    // spawn obstacles in a grid pattern to ensure coverage
    for (let dy = -3; dy <= 3; dy++)
    for (let dx = -3; dx <= 3; dx++)
    {
        const gx = gridX + dx;
        const gy = gridY + dy;
        
        // check if this grid cell should have an obstacle
        const seed = 1 + (gx * 73856093 ^ gy * 19349663);
        const rng = new RandomGenerator(seed);
        
        if (rng.float() < .25) // 25% chance of obstacle in each cell
        {
            const cellCenter = vec2(gx * gridSize + gridSize/2, gy * gridSize + gridSize/2);
            const offset = vec2(rng.float(-3, 3), rng.float(-3, 3));
            const pos = cellCenter.add(offset);
            
            // check if already exists
            let exists = false;
            for (const obs of obstacles)
            {
                if (obs.pos.distance(pos) < 2)
                {
                    exists = true;
                    break;
                }
            }
            
            if (!exists)
            {
                const r = rng.float();
                const type = r < .5 ? 'tree' : r < .75 ? 'rock' : r < .95 ? 'bump' : 'ramp';
                spawnObstacleAt(pos, type);
            }
        }
    }
}

function updateObstacles()
{
    // spawn obstacles around player
    spawnObstaclesAround(player.pos);
    
    // remove obstacles far from player
    for (let i = obstacles.length - 1; i >= 0; i--)
    {
        const obs = obstacles[i];
        const dist = obs.pos.distance(player.pos);
        
        if (dist > OBSTACLE_SPAWN_RADIUS * 1.5)
        {
            obstacles.splice(i, 1);
            continue;
        }

        // collision check (more forgiving - 50% smaller collision)
        const collisionScale = 0.5;
        
        if (!player.crashed && !player.isJumping &&
            abs(obs.pos.x - player.pos.x) < (obs.size.x * collisionScale + PLAYER_SIZE.x * collisionScale) / 2 &&
            abs(obs.pos.y - player.pos.y) < (obs.size.y * collisionScale + PLAYER_SIZE.y * collisionScale) / 2)
        {
            if (obs.type === 'bump')
            {
                player.jump();
            }
            else if (obs.type === 'ramp')
            {
                player.hitRamp();
            }
            else
            {
                player.crash();
            }
        }
    }
}

function renderBgLines()
{
    // draw a grid pattern for depth
    const gridSize = 5;
    const centerPos = player ? player.pos : vec2(0, 0);
    const offsetX = mod(centerPos.x, gridSize);
    const offsetY = mod(centerPos.y, gridSize);
    
    const cam = cameraPos;
    const size = getCameraSize();
    
    for (let y = -size.y/2; y < size.y/2; y += gridSize)
    {
        const worldY = cam.y + y - offsetY;
        drawRect(vec2(cam.x, worldY), vec2(size.x, .12), hsl(.55, .3, .75, .25));
    }
    
    for (let x = -size.x/2; x < size.x/2; x += gridSize)
    {
        const worldX = cam.x + x - offsetX;
        drawRect(vec2(worldX, cam.y), vec2(.12, size.y), hsl(.55, .3, .75, .25));
    }
}

function renderObstacles()
{
    // render in order: bumps, ramps, rocks, trees
    const renderOrder = ['bump', 'ramp', 'rock', 'tree'];
    
    for (const type of renderOrder)
    {
        for (const obs of obstacles)
        {
            if (obs.type !== type) continue;
            
            if (obs.type === 'tree')
            {
                // tree trunk
                drawRect(obs.pos, vec2(.4, obs.size.y * .6), hsl(.08, .4, .3));
                
                // tree foliage - layered triangles
                const top = obs.pos.add(vec2(0, obs.size.y * .3));
                drawRegularPoly(top, vec2(.9, .9), 3, hsl(.33, .6, .3));
                drawRegularPoly(top.add(vec2(0, -.3)), vec2(1.1, 1.1), 3, hsl(.33, .6, .35));
                drawRegularPoly(top.add(vec2(0, -.6)), vec2(1.3, 1.3), 3, hsl(.33, .6, .25));
            }
            else if (obs.type === 'rock')
            {
                // gray rock
                drawTile(obs.pos, vec2(obs.size.x * .6), icons.circle, hsl(0, 0, .4));
                drawTile(obs.pos.add(vec2(.15, .1)), vec2(obs.size.x * .4), icons.circle, hsl(0, 0, .5));
            }
            else if (obs.type === 'bump')
            {
                // small snow bump
                drawTile(obs.pos, obs.size, icons.circle, hsl(.55, .2, .8));
                drawTile(obs.pos, obs.size.scale(.7), icons.circle, hsl(.55, .1, .9));
            }
            else if (obs.type === 'ramp')
            {
                // rainbow ramp
                const colors = [
                    hsl(0, .9, .6),
                    hsl(.15, .9, .6),
                    hsl(.28, .9, .6),
                    hsl(.55, .9, .6),
                ];
                
                for (let i = 0; i < colors.length; i++)
                {
                    const offset = (i - 1.5) * .25;
                    drawRect(obs.pos.add(vec2(offset, 0)), vec2(.3, obs.size.y), colors[i]);
                }
            }
        }
    }
}

///////////////////////////////////////////////////////////////////////////////
// Particles

// Persistent snow-spray trail emitter (emitRate driven by Player.update; 0=off).
function makeSnowEmitter()
{
    return new ParticleEmitter(
        vec2(), 0,           // pos, angle (driven each frame)
        0,                   // emitSize (point)
        0, 0,                // emitTime (0 = forever), emitRate (driven; 0 = off)
        .5,                  // emitConeAngle (spray spread)
        icons.circle,        // tileInfo (atlas circle)
        hsl(0,0,1,.8), hsl(0,0,1,.8),  // white snow
        hsl(0,0,1,0), hsl(0,0,1,0),    // fade to transparent
        .6,                  // particleTime (~rand .3-.6)
        .22, .22,            // sizeStart, sizeEnd (was rand .15-.3, constant)
        3/60,                // speed (per-frame; was per-sec rand 2-4)
        0, .95, 1,           // angleSpeed, damping, angleDamping
        1,                   // gravityScale (global gravity = -8/sec^2)
        0, .15, .4,          // particleConeAngle, fadeRate, randomness
        false, false         // collideTiles, additive (snow = matte)
    );
}

// clearParticles() lives in gameFx.js (shared).

///////////////////////////////////////////////////////////////////////////////
// Game Logic

function resetGame()
{
    player = new Player();
    score = 0;
    distance = 0;
    gameTime = 0;
    gameState = 'playing';
    gameStarted = true;

    obstacles = [];
    clearParticles();
    snowEmitter = makeSnowEmitter();

    // spawn initial obstacles around spawn
    spawnObstaclesAround(player.pos);
}

///////////////////////////////////////////////////////////////////////////////
// LittleJS Callbacks

let icons;   // default-atlas icon map (name -> TileInfo), tinted per draw

async function gameInit()
{
    saveDataInit('skiing');
    icons = initDefaultAtlas();

    // Snow-spray + crash particles run on the engine's ParticleEmitter, whose
    // gravity comes from the global `gravity`. The skier's jump uses its own
    // GRAVITY const, so set the global to the old particle pull (-8/sec^2 in
    // the emitter's per-frame model). No EngineObjects read it.
    gravity = vec2(0, -8/3600);

    // sounds
    sfxWoosh = new SoundGenerator({frequency: 180, release: .15, noise: .1, volume: .3});
    sfxCrash = new SoundGenerator({frequency: 120, release: .4, noise: .3, volume: .6});
    sfxStart = new SoundGenerator({frequency: 440, release: .15, slide: .3, volume: .4});

    buildMenus();
    // Set up the world so the title screen shows the actual start state
    // (skier at the top, obstacles laid out), frozen behind the
    // menu via installAutoPause.
    resetGame();
    showMenu('title');
}

function startGame()
{
    resetGame();
    setPlaying(true);
    clearSubmenuStack();
    hideAllMenus();
    sfxStart && sfxStart.play();
}

function quitToTitleWithCleanup()
{
    // Reset back to fresh start state so the title backdrop shows what
    // the run looks like at the top of the slope, frozen behind the menu.
    quitToTitle(resetGame);
}

function buildMenus()
{
    if (typeof createMenu !== 'function') return;

    installAutoPause();
    setOrientationLock('landscape');

    setMenuTheme({accent:'#7fd4ff'});
    createTitleMenu({
        title: 'DOWNHILL SKI',
        titleFx: {fill:'shine', color:'#cff', sparkle:true},
        subtitle: '',
        onPlay: startGame,
        revealOnClick: false,
        items: [
            {type:'button', label:'HELP', onClick: () => pushMenu('help')},
        ],
    });

    createHelpMenu({
        title: 'HELP',
        text: 'Ski downhill as far as possible without crashing. Move the mouse to steer — aim toward the slopes to accelerate, veer sideways to slow down. Click or tap to jump over obstacles.',
        extraItems: [
            {type:'text', text:'Mouse steer · Click jump'},
        ],
    });

    createPauseMenu({
        onRestart: startGame,
        onQuit:    quitToTitleWithCleanup,
    });

    installDefaultToolbar();
}

function gameUpdate()
{
    if (bindPauseKey({when: () => isPlaying() && gameState !== 'crashed'})) return;
    if (!isPlaying()) return;

    if (gameState === 'crashed')
    {
        if (keyWasPressed('Space') || keyWasPressed('Enter') || keyWasPressed('KeyR')
            || gamepadWasPressed(0) || gamepadWasPressed(9)) // gamepad A or Start
            resetGame();
        return;
    }

    if (gameState === 'playing')
    {
        // track time and distance
        gameTime += timeDelta;
        const speed = player.vel.length();
        distance += speed * timeDelta;

        player.update();
        updateObstacles();
    }
}

function gameUpdatePost()
{
    // camera follows player
    if (player)
        cameraPos = player.pos.copy();
    else
        cameraPos = vec2(0, 0);
}

function gameRender()
{
    // background - snowy slope
    drawRect(cameraPos, getCameraSize(), hsl(.55, .3, .85));

    // slope lines using grid
    renderBgLines();

    if (gameStarted)
    {
        renderObstacles();
        player.render();
    }
}

function gameRenderPost()
{
    // No HUD while the title (or any menu) is up — backdrop sits frozen.
    if (!isPlaying()) return;

    // HUD - top left
    const speed = player.vel.length();
    const minutes = (gameTime / 60) | 0;
    const seconds = (gameTime % 60) | 0;
    const timeStr = `${minutes}:${seconds.toString().padStart(2, '0')}`;
    
    drawTextScreen(`Distance: ${distance.toFixed(0)}m`, vec2(20, 30), 32, hsl(0, 0, 1), 4, hsl(0, 0, 0), 'left');
    drawTextScreen(`Speed: ${speed.toFixed(1)}`, vec2(20, 70), 32, hsl(.6, .8, .7), 4, hsl(0, 0, 0), 'left');
    drawTextScreen(`Time: ${timeStr}`, vec2(20, 110), 32, hsl(.55, .7, .7), 4, hsl(0, 0, 0), 'left');

    if (gameState === 'crashed')
    {
        drawTextScreen('CRASHED!', vec2(mainCanvasSize.x / 2, mainCanvasSize.y / 2 - 80), 100, hsl(0, .9, .5), 11, hsl(0, 0, 0));
        drawTextScreen(`Distance: ${distance.toFixed(0)}m`, vec2(mainCanvasSize.x / 2, mainCanvasSize.y / 2 + 40), 50, hsl(0, 0, 1), 6, hsl(0, 0, 0));
        drawTextScreen(`Time: ${timeStr}`, vec2(mainCanvasSize.x / 2, mainCanvasSize.y / 2 + 110), 40, hsl(0, 0, 1), 5, hsl(0, 0, 0));
        drawTextScreen('Press SPACE or R to retry', vec2(mainCanvasSize.x / 2, mainCanvasSize.y / 2 + 200), 36, hsl(.6, .8, .7), 4, hsl(0, 0, 0));
    }
}

///////////////////////////////////////////////////////////////////////////////
engineInit(gameInit, gameUpdate, gameUpdatePost, gameRender, gameRenderPost);

</script>
